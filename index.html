      width: 44px;
      height: 44px;
      border-radius: 22px;

    .canvas-wrap {

    /* Bottom toolbar */
    .toolbar {
      -webkit-flex: 0 0 auto;

      padding-bottom: env(safe-area-inset-bottom, 6px);

      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: start;
      -webkit-justify-content: flex-start;

    }
    .tool-btn {
      -webkit-appearance: none;
      appearance: none;

      border: 0;
      border-radius: 10px;
      min-width: 44px;
      min-height: 44px;

      flex: 0 0 auto;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;

    body.dark .tool-btn {

    .tdiv {

    .swatch-btn {

    /* ============================================================

    /* Color grid */

<body>
  <div id="warning"></div>

  <!-- ============== HOME VIEW ============== -->
  <div id="homeView" class="view active">
    <div class="home-header">
      <h1>Notebooks</h1>
      <button id="darkToggle" class="icon-btn">&#9790;</button>
    </div>
    <div class="scroll-area">
      <div id="notebookGrid"></div>
    </div>
    <button id="newNotebookBtn" class="fab">+</button>
  </div>

  <script>
  /* ================================================================
     MATHNOTES v2 — single-file ES5 app for Safari 9 / iOS 9.3.5
     ================================================================
     ARCHITECTURE
       Section A: DRAWING ENGINE  (touch/mouse, stroke model, storage,
                                   rendering, undo/redo, pages, export)
       Section B: UI / VIEWS      (home gallery, draw view, pages sheet,
                                   color/size pickers, export overlay)
       Section C: BOOT             (init, event wiring)
     The engine has no knowledge of markup. A future v3 can reskin
     Section B without touching Section A.
     ================================================================ */
  (function () {
    'use strict';

    /* ============================================================
       SECTION A — DRAWING ENGINE
       ============================================================ */

    var STORAGE_KEY_V1 = 'mathnotes_v1';
    var STORAGE_KEY_V2 = 'mathnotes_v2';
    var ERASE_RADIUS    = 16;
    var MAX_UNDO       = 100;
    var MAX_REDO       = 100;

    var COLOR_PALETTE = [
      '#000000', '#5b5b5b', '#e63946', '#f77f00',
      '#fcbf49', '#06a77d', '#118ab2', '#073b4c',
      '#6a4c93', '#d62898', '#8d5524', '#ffffff'
    ];
    var NOTEBOOK_COLORS = ['#0a84ff', '#ff9500', '#ff3b30', '#34c759',
                           '#5856d6', '#af52de', '#ff2d55', '#5ac8fa'];

    var SIZE_PRESETS = [
      { name: 'Extra Fine', w: 1.5 },
      { name: 'Fine',       w: 3 },
      { name: 'Medium',     w: 5 },
      { name: 'Bold',       w: 8 },
      { name: 'Heavy',      w: 13 }
    ];

    var PEN_OPACITY = {
      pen:         1.0,
      marker:      0.55,
      highlighter: 0.22,
      pencil:      0.85
    };
    var PEN_WIDTH_MULT = {
      pen:         1.0,
      marker:      1.4,
      highlighter: 3.0,
      pencil:      0.9
    };
    var PEN_CAP = {
      pen:         'round',
      marker:      'round',
      highlighter: 'butt',
      pencil:      'round'
    };
    var PEN_BLEND = {
      pen:         'source-over',
      marker:      'source-over',
      highlighter: 'multiply',
      pencil:      'source-over'
    };

    var dpr = window.devicePixelRatio || 1;

    /* DOM refs */
    var canvas, ctx, canvasWrap, toolbarEl, warningEl;
    var pageIndEl, nbNameEl;
    var homeView, drawView, notebookGrid;
    var pagesOverlay, colorOverlay, sizeOverlay, exportOverlay;
    var exportImg, colorDotEl;

    /* State */
    var notebooks = [];        /* [{id,title,color,pages:[{strokes,undoStack,redoStack}]}] */
    var currentNotebook = 0;
    var currentPage = 0;
    var currentTool  = 'pen';
    var currentColor = '#000000';
    var currentSize  = 3;      /* index into SIZE_PRESETS */
    var isDrawing    = false;
    var currentStroke = null;
    var storageOk    = true;
    var darkMode     = false;
    var saveTimer    = null;

    /* ---------- Storage layer (graceful degradation) ---------- */
    function showWarning(msg) {
      if (!warningEl) return;
      warningEl.textContent = msg;
      warningEl.style.display = 'block';
    }
    function hideWarning() {
      if (warningEl) warningEl.style.display = 'none';
    }

    function genId() {
      return 'nb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    }
    function newNotebook(title) {
      return {
        id: genId(),
        title: title || 'Untitled',
        color: NOTEBOOK_COLORS[notebooks.length % NOTEBOOK_COLORS.length],
        pages: [ { strokes: [], undoStack: [], redoStack: [] } ]
      };
    }
    function newPage() {
      return { strokes: [], undoStack: [], redoStack: [] };
    }

    /* Migration from v1: wrap v1's flat page array as one notebook */
    function migrateFromV1() {
      var old = null;
      try {
        var raw = localStorage.getItem(STORAGE_KEY_V1);
        if (raw) old = JSON.parse(raw);
      } catch (e) { old = null; }
      if (!old || !old.pages || old.pages.length === 0) return null;

      var pages = [];
      for (var i = 0; i < old.pages.length; i++) {
        var strokes = (old.pages[i] && old.pages[i].strokes) ? old.pages[i].strokes : [];
        /* upgrade each stroke with new fields */
        var upgraded = [];
        for (var j = 0; j < strokes.length; j++) {
          var s = strokes[j];
          if (s && s.points && s.points.length > 0) {
            upgraded.push({
              type:    s.type || 'pen',
              color:   s.color || '#000000',
              width:   s.width || 4,
              opacity: s.opacity != null ? s.opacity : 1.0,
              points:  s.points
            });
          }
        }
        if (upgraded.length > 0 || pages.length === 0) {
          pages.push({ strokes: upgraded, undoStack: [], redoStack: [] });
        }
      }
      if (pages.length === 0) pages.push({ strokes: [], undoStack: [], redoStack: [] });

      return {
        version: 2,
        notebooks: [ {
          id: 'nb_migrated',
          title: 'My Notes',
          color: '#0a84ff',
          pages: pages
        } ],
        currentNotebook: 0,
        currentPage: 0,
        settings: { darkMode: false }
      };
    }

    function loadFromStorage() {
      var data = null;
      if (storageOk) {
        try {
          var raw = localStorage.getItem(STORAGE_KEY_V2);
          if (raw) data = JSON.parse(raw);
        } catch (e) {
          storageOk = false;
          showWarning('Could not read saved notes (' + e.message + '). Starting fresh.');
        }
      }
      if (!data) {
        data = migrateFromV1();
      }
      if (data && data.notebooks && data.notebooks.length > 0) {
        notebooks = [];
        for (var i = 0; i < data.notebooks.length; i++) {
          var nb = data.notebooks[i];
          var pages = [];
          for (var j = 0; j < nb.pages.length; j++) {
            var p = nb.pages[j];
            pages.push({
              strokes:   (p && p.strokes) ? p.strokes : [],
              undoStack: [],
              redoStack: []
            });
          }
          if (pages.length === 0) pages.push(newPage());
          notebooks.push({
            id:    nb.id || genId(),
            title: nb.title || 'Untitled',
            color: nb.color || NOTEBOOK_COLORS[i % NOTEBOOK_COLORS.length],
            pages: pages
          });
        }
        currentNotebook = data.currentNotebook || 0;
        if (currentNotebook >= notebooks.length) currentNotebook = notebooks.length - 1;
        currentPage = data.currentPage || 0;
        var cnb = notebooks[currentNotebook];
        if (currentPage >= cnb.pages.length) currentPage = cnb.pages.length - 1;
        darkMode = !!(data.settings && data.settings.darkMode);
      } else {
        notebooks = [ newNotebook('My Notes') ];
        currentNotebook = 0;
        currentPage = 0;
      }
    }

    function saveToStorage() {
      if (!storageOk) return;
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        var toSave = {
          version: 2,
          notebooks: [],
          currentNotebook: currentNotebook,
          currentPage: currentPage,
          settings: { darkMode: darkMode }
        };
        for (var i = 0; i < notebooks.length; i++) {
          var nb = notebooks[i];
          var nbPages = [];
          for (var j = 0; j < nb.pages.length; j++) {
            nbPages.push({ strokes: nb.pages[j].strokes });
          }
          toSave.notebooks.push({
            id: nb.id, title: nb.title, color: nb.color, pages: nbPages
          });
        }
        try {
          localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(toSave));
        } catch (e) {
          storageOk = false;
          showWarning('Cannot save notes. You may be in Private Browsing mode, or storage is full. Notes will not persist after reload.');
        }
      }, 120);
    }

    /* ---------- Geometry helpers ---------- */
    function distToSegment(px, py, x1, y1, x2, y2) {
      var dx = x2 - x1, dy = y2 - y1;
      var len2 = dx * dx + dy * dy;
      if (len2 === 0) {
        var ex0 = px - x1, ey0 = py - y1;
        return Math.sqrt(ex0 * ex0 + ey0 * ey0);
      }
      var t = ((px - x1) * dx + (py - y1) * dy) / len2;
      if (t < 0) t = 0;
      else if (t > 1) t = 1;
      var cx = x1 + t * dx, cy = y1 + t * dy;
      var ex = px - cx, ey = py - cy;
      return Math.sqrt(ex * ex + ey * ey);
    }
    function strokeHit(stroke, x, y, radius) {
      var pts = stroke.points;
      if (!pts || pts.length === 0) return false;
      var r = Math.max(radius, (stroke.width || 4) / 2);
      if (pts.length === 1) {
        var dx = pts[0].x - x, dy = pts[0].y - y;
        return Math.sqrt(dx * dx + dy * dy) <= r;
      }
      for (var i = 0; i < pts.length - 1; i++) {
        if (distToSegment(x, y, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y) <= r) {
          return true;
        }
      }
      return false;
    }

    /* ---------- Stroke rendering ---------- */
    function applyStrokeStyle(stroke) {
      var op = stroke.opacity != null ? stroke.opacity : 1.0;
      ctx.globalAlpha = op;
      ctx.globalCompositeOperation = PEN_BLEND[stroke.type] || 'source-over';
      ctx.strokeStyle = stroke.color;
      ctx.fillStyle   = stroke.color;
      ctx.lineWidth   = stroke.width;
      ctx.lineCap     = PEN_CAP[stroke.type] || 'round';
      ctx.lineJoin    = 'round';
    }
    function resetCtxStyle() {
      ctx.globalAlpha = 1.0;
      ctx.globalCompositeOperation = 'source-over';
    }

    function renderStroke(stroke) {
      var pts = stroke.points;
      if (!pts || pts.length === 0) { return; }
      applyStrokeStyle(stroke);
      if (pts.length === 1) {
        ctx.beginPath();
        ctx.arc(pts[0].x, pts[0].y, Math.max(0.5, stroke.width / 2), 0, Math.PI * 2);
        ctx.fill();
        resetCtxStyle();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      if (pts.length === 2) {
        ctx.lineTo(pts[1].x, pts[1].y);
      } else {
        /* Smooth full-curve render: midpoint quadratic through every point */
        for (var i = 1; i < pts.length - 1; i++) {
          var mx = (pts[i].x + pts[i + 1].x) / 2;
          var my = (pts[i].y + pts[i + 1].y) / 2;
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
        }
        ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
      }
      ctx.stroke();
      resetCtxStyle();
    }

    function clearCanvasPixels() {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }
    function renderPage() {
      clearCanvasPixels();
      var page = currentPageObj();
      if (page) {
        for (var i = 0; i < page.strokes.length; i++) {
          renderStroke(page.strokes[i]);
        }
      }
      if (currentStroke) renderStroke(currentStroke);
      updatePageIndicator();
    }

    function resizeCanvas() {
      if (!canvas || !ctx) return;
      var cssW = canvasWrap.offsetWidth;
      var cssH = canvasWrap.offsetHeight;
      if (cssW < 60) cssW = 60;
      if (cssH < 60) cssH = 60;
      canvas.style.width  = cssW + 'px';
      canvas.style.height = cssH + 'px';
      canvas.width  = Math.floor(cssW * dpr);
      canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderPage();
    }

    /* ---------- Page accessor ---------- */
    function currentPageObj() {
      var nb = notebooks[currentNotebook];
      if (!nb) return null;
      return nb.pages[currentPage];
    }

    /* ---------- Stroke lifecycle (incremental + smooth) ----------
       SMOOTHNESS TECHNIQUE: midpoint quadratic curves.
       When a new point P[n] arrives and we already have P[n-2] and P[n-1],
       we draw a quadratic curve from midpoint(P[n-2], P[n-1]) to
       midpoint(P[n-1], P[n]) using P[n-1] as the control point. This
       produces a C1-continuous smooth curve incrementally — the same
       technique used by Apple PencilKit. Round line caps fill the
       tiny seams between segments, so the result looks continuous.
       ---------------------------------------------------------------- */
    function effectiveWidth(tool, sizeIdx) {
      var mult = PEN_WIDTH_MULT[tool] || 1.0;
      return SIZE_PRESETS[sizeIdx].w * mult;
    }

    function startStroke(x, y) {
      if (currentTool === 'eraser') return;
      var w = effectiveWidth(currentTool, currentSize);
      var op = PEN_OPACITY[currentTool] != null ? PEN_OPACITY[currentTool] : 1.0;
      currentStroke = {
        type:    currentTool,
        color:   currentColor,
        width:   w,
        opacity: op,
        points:  [{ x: x, y: y }]
      };
      /* Draw initial dot so single taps render */
      applyStrokeStyle(currentStroke);
      ctx.beginPath();
      ctx.arc(x, y, Math.max(0.5, w / 2), 0, Math.PI * 2);
      ctx.fill();
      resetCtxStyle();
    }

    function continueStroke(x, y) {
      if (!isDrawing) return;
      if (currentTool !== 'eraser' && currentStroke) {
        var pts = currentStroke.points;
        var n = pts.length;
        var last = pts[n - 1];
        var dx = x - last.x, dy = y - last.y;
        if (dx * dx + dy * dy < 0.8) return;   /* skip sub-pixel jitter */

        applyStrokeStyle(currentStroke);
        ctx.beginPath();
        if (n === 1) {
          /* First move: straight line from pts[0] to (x,y).
             Next move will smooth over this with a midpoint curve. */
          ctx.moveTo(pts[0].x, pts[0].y);
          ctx.lineTo(x, y);
        } else {
          /* Midpoint quadratic for smoothness */
          var pPrev = pts[n - 2];
          var mid0x = (pPrev.x + last.x) / 2;
          var mid0y = (pPrev.y + last.y) / 2;
          var mid1x = (last.x + x) / 2;
          var mid1y = (last.y + y) / 2;
          ctx.moveTo(mid0x, mid0y);
          ctx.quadraticCurveTo(last.x, last.y, mid1x, mid1y);
        }
        ctx.stroke();
        resetCtxStyle();
        pts.push({ x: x, y: y });
        return;
      }
      if (currentTool === 'eraser') {
        eraseAt(x, y);
        return;
      }
    }

    function endStroke() {
      if (!isDrawing) {
        currentStroke = null;
        return;
      }
      isDrawing = false;
      if (currentStroke && currentStroke.points.length > 0) {
        var page = currentPageObj();
        if (page) {
          page.strokes.push(currentStroke);
          page.undoStack.push({ type: 'draw', stroke: currentStroke });
          page.redoStack = [];   /* new action invalidates redo */
          if (page.undoStack.length > MAX_UNDO) page.undoStack.shift();
          saveToStorage();
        }
      }
      currentStroke = null;
      /* NO renderPage() — stroke already drawn incrementally */
    }

    /* ---------- Eraser (object-level) ---------- */
    function eraseAt(x, y) {
      var page = currentPageObj();
      if (!page) return;
      var removed = [], kept = [];
      for (var i = 0; i < page.strokes.length; i++) {
        var s = page.strokes[i];
        if (strokeHit(s, x, y, ERASE_RADIUS)) removed.push(s);
        else kept.push(s);
      }
      if (removed.length > 0) {
        page.strokes = kept;
        page.undoStack.push({ type: 'erase', strokes: removed });
        page.redoStack = [];
        if (page.undoStack.length > MAX_UNDO) page.undoStack.shift();
        saveToStorage();
        renderPage();   /* erase requires a full re-render */
      }
    }

    /* ---------- Undo / Redo ---------- */
    function undo() {
      var page = currentPageObj();
      if (!page || page.undoStack.length === 0) return;
      var action = page.undoStack.pop();
      if (action.type === 'draw') {
        var idx = page.strokes.indexOf(action.stroke);
        if (idx >= 0) page.strokes.splice(idx, 1);
        page.redoStack.push(action);
      } else if (action.type === 'erase') {
        for (var i = 0; i < action.strokes.length; i++) {
          page.strokes.push(action.strokes[i]);
        }
        page.redoStack.push(action);
      } else if (action.type === 'clear') {
        page.strokes = action.strokes;
        page.redoStack.push(action);
      }
      if (page.redoStack.length > MAX_REDO) page.redoStack.shift();
      saveToStorage();
      renderPage();
    }
    function redo() {
      var page = currentPageObj();
      if (!page || page.redoStack.length === 0) return;
      var action = page.redoStack.pop();
      if (action.type === 'draw') {
        page.strokes.push(action.stroke);
        page.undoStack.push(action);
      } else if (action.type === 'erase') {
        /* remove again */
        var kept = [];
        for (var i = 0; i < page.strokes.length; i++) {
          var found = false;
          for (var j = 0; j < action.strokes.length; j++) {
            if (page.strokes[i] === action.strokes[j]) { found = true; break; }
          }
          if (!found) kept.push(page.strokes[i]);
        }
        page.strokes = kept;
        page.undoStack.push(action);
      } else if (action.type === 'clear') {
        page.undoStack.push({ type: 'clear', strokes: page.strokes.slice() });
        page.strokes = [];
      }
      if (page.undoStack.length > MAX_UNDO) page.undoStack.shift();
      saveToStorage();
      renderPage();
    }

    /* ---------- Clear page ---------- */
    function clearPage() {
      var page = currentPageObj();
      if (!page || page.strokes.length === 0) return;
      if (!confirm('Clear all strokes on this page?')) return;
      var snapshot = page.strokes.slice();
      page.undoStack.push({ type: 'clear', strokes: snapshot });
      page.redoStack = [];
      if (page.undoStack.length > MAX_UNDO) page.undoStack.shift();
      page.strokes = [];
      saveToStorage();
      renderPage();
    }

    /* ---------- Navigation ---------- */
    function goToPage(idx) {
      var nb = notebooks[currentNotebook];
      if (!nb) return;
      if (idx < 0 || idx >= nb.pages.length) return;
      if (idx === currentPage) return;
      endStroke();
      currentPage = idx;
      saveToStorage();
      renderPage();
    }
    function nextPage() {
      var nb = notebooks[currentNotebook];
      if (!nb) return;
      goToPage(currentPage + 1);
    }
    function prevPage() {
      goToPage(currentPage - 1);
    }
    function addPage() {
      var nb = notebooks[currentNotebook];
      if (!nb) return;
      nb.pages.push(newPage());
      saveToStorage();
      goToPage(nb.pages.length - 1);
    }
    function deletePage(idx) {
      var nb = notebooks[currentNotebook];
      if (!nb) return;
      if (nb.pages.length <= 1) {
        alert('A notebook must have at least one page.');
        return;
      }
      if (!confirm('Delete page ' + (idx + 1) + '?')) return;
      nb.pages.splice(idx, 1);
      if (currentPage >= nb.pages.length) currentPage = nb.pages.length - 1;
      saveToStorage();
      renderPage();
      refreshPagesList();
    }

    /* ---------- Notebook ops ---------- */
    function openNotebook(idx) {
      if (idx < 0 || idx >= notebooks.length) return;
      endStroke();
      currentNotebook = idx;
      currentPage = 0;
      saveToStorage();
      showView('draw');
      nbNameEl.textContent = notebooks[idx].title;
      /* Wait for layout to settle before sizing the canvas */
      setTimeout(function () {
        resizeCanvas();
        renderPage();
      }, 60);
    }
    function createNotebook() {
      var title = prompt('Notebook name:', 'Notebook ' + (notebooks.length + 1));
      if (title === null) return;
      if (!title) title = 'Untitled';
      notebooks.push(newNotebook(title));
      saveToStorage();
      renderHome();
    }
    function renameNotebook(idx) {
      var nb = notebooks[idx];
      if (!nb) return;
      var t = prompt('Rename notebook:', nb.title);
      if (t === null) return;
      if (!t) t = 'Untitled';
      nb.title = t;
      saveToStorage();
      renderHome();
      if (idx === currentNotebook) nbNameEl.textContent = t;
    }
    function deleteNotebook(idx) {
      if (notebooks.length <= 1) {
        alert('You must have at least one notebook.');
        return;
      }
      var nb = notebooks[idx];
      if (!confirm('Delete notebook "' + nb.title + '" and all its pages?')) return;
      notebooks.splice(idx, 1);
      if (currentNotebook >= notebooks.length) currentNotebook = notebooks.length - 1;
      currentPage = 0;
      saveToStorage();
      renderHome();
    }

    /* ---------- Export PNG ---------- */
    function exportPNG() {
      endStroke();
      renderPage();
      var dataURL;
      try {
        dataURL = canvas.toDataURL('image/png');
      } catch (e) {
        alert('Export failed: ' + e.message);
        return;
      }
      exportImg.src = dataURL;
      exportOverlay.className = 'overlay active';
    }

    /* ---------- Position helper ---------- */
    function getPos(e) {
      var rect = canvas.getBoundingClientRect();
      var cx, cy;
      if (e.touches && e.touches.length > 0) {
        cx = e.touches[0].clientX; cy = e.touches[0].clientY;
      } else if (e.changedTouches && e.changedTouches.length > 0) {
        cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
      } else {
        cx = e.clientX; cy = e.clientY;
      }
      return { x: cx - rect.left, y: cy - rect.top };
    }

    /* ---------- Canvas event wiring ---------- */
    function initCanvasEvents() {
      function onTouchStart(e) {
        e.preventDefault();
        var p = getPos(e);
        isDrawing = true;
        if (currentTool === 'eraser') eraseAt(p.x, p.y);
        else startStroke(p.x, p.y);
      }
      function onTouchMove(e) {
        e.preventDefault();
        var p = getPos(e);
        continueStroke(p.x, p.y);
      }
      function onTouchEnd(e) {
        e.preventDefault();
        endStroke();
      }
      canvas.addEventListener('touchstart',  onTouchStart,  false);
      canvas.addEventListener('touchmove',   onTouchMove,   false);
      canvas.addEventListener('touchend',    onTouchEnd,    false);
      canvas.addEventListener('touchcancel', onTouchEnd,    false);

      function onMouseDown(e) {
        var p = getPos(e);
        isDrawing = true;
        if (currentTool === 'eraser') eraseAt(p.x, p.y);
        else startStroke(p.x, p.y);
      }
      function onMouseMove(e) {
        if (!isDrawing) return;
        var p = getPos(e);
        continueStroke(p.x, p.y);
      }
      function onMouseUp()   { endStroke(); }
      function onMouseLeave() { if (isDrawing) endStroke(); }
      canvas.addEventListener('mousedown',  onMouseDown,  false);
      canvas.addEventListener('mousemove',  onMouseMove,  false);
      canvas.addEventListener('mouseup',    onMouseUp,    false);
      canvas.addEventListener('mouseleave', onMouseLeave, false);

      canvas.addEventListener('gesturestart',  function (e) { e.preventDefault(); }, false);
      canvas.addEventListener('gesturechange', function (e) { e.preventDefault(); }, false);
      canvas.addEventListener('gestureend',    function (e) { e.preventDefault(); }, false);
    }

    function initGlobalEvents() {
      document.addEventListener('gesturestart',  function (e) { e.preventDefault(); }, false);
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, false);
      document.addEventListener('dblclick',      function (e) { e.preventDefault(); }, false);

      var resizeTimer = null;
      function onResize() {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          if (isDrawing) endStroke();
          if (drawView.className.indexOf('active') >= 0) {
            resizeCanvas();
          } else {
            renderHomeThumbs();
          }
        }, 150);
      }
      window.addEventListener('resize',            onResize, false);
      window.addEventListener('orientationchange', onResize, false);
    }

    /* ============================================================
       SECTION B — UI / VIEWS
       ============================================================ */

    function showView(name) {
      homeView.className  = 'view' + (name === 'home'  ? ' active' : '');
      drawView.className  = 'view' + (name === 'draw'  ? ' active' : '');
      if (name === 'home') {
        renderHome();
      }
    }

    /* ---------- Home: notebook gallery ---------- */
    function renderHome() {
      notebookGrid.innerHTML = '';
      for (var i = 0; i < notebooks.length; i++) {
        (function (idx, nb) {
          var card = document.createElement('div');
          card.className = 'notebook-card';
          var inner = document.createElement('div');
          inner.className = 'notebook-card-inner';

          var thumb = document.createElement('div');
          thumb.className = 'notebook-thumb';
          thumb.style.background = nb.color;
          var cover = document.createElement('div');
          cover.className = 'nb-cover';
          /* First letter as cover icon */
          cover.textContent = (nb.title && nb.title.length > 0) ? nb.title.charAt(0).toUpperCase() : 'N';
          thumb.appendChild(cover);

          var info = document.createElement('div');
          info.className = 'notebook-info';
          var titleEl = document.createElement('div');
          titleEl.className = 'notebook-title';
          titleEl.textContent = nb.title;
          var metaEl = document.createElement('div');
          metaEl.className = 'notebook-meta';
          metaEl.textContent = nb.pages.length + (nb.pages.length === 1 ? ' page' : ' pages');
          info.appendChild(titleEl);
          info.appendChild(metaEl);

          inner.appendChild(thumb);
          inner.appendChild(info);
          card.appendChild(inner);
          notebookGrid.appendChild(card);

          /* Tap = open, long-press = menu */
          var tapTimer = null;
          var longPressed = false;
          bindTapAndLongPress(inner, function () {
            if (longPressed) { longPressed = false; return; }
            openNotebook(idx);
          }, function () {
            longPressed = true;
            var choice = confirm(
              'Notebook: ' + nb.title + '\n\nOK = Rename\nCancel = Delete'
            );
            if (choice) renameNotebook(idx);
            else deleteNotebook(idx);
          });
        })(i, notebooks[i]);
      }
    }

    function renderHomeThumbs() {
      /* hook for future thumbnail rendering; not used for now since
         we use letter covers for performance */
    }

    /* ---------- Pages sheet ---------- */
    function refreshPagesList() {
      var nb = notebooks[currentNotebook];
      if (!nb) return;
      var list = document.getElementById('pageThumbList');
      list.innerHTML = '';
      for (var i = 0; i < nb.pages.length; i++) {
        (function (idx, page) {
          var row = document.createElement('div');
          row.className = 'page-thumb' + (idx === currentPage ? ' active' : '');
          var frame = document.createElement('div');
          frame.className = 'thumb-frame';
          var tc = document.createElement('canvas');
          tc.width = 200; tc.height = 150;
          var tctx = tc.getContext('2d');
          tctx.fillStyle = '#ffffff';
          tctx.fillRect(0, 0, 200, 150);
          tctx.setTransform(200.0 / canvasWrap.offsetWidth, 0, 0, 150.0 / canvasWrap.offsetHeight, 0, 0);
          for (var j = 0; j < page.strokes.length; j++) {
            var s = page.strokes[j];
            tctx.globalAlpha = s.opacity != null ? s.opacity : 1.0;
            tctx.globalCompositeOperation = PEN_BLEND[s.type] || 'source-over';
            tctx.strokeStyle = s.color;
            tctx.fillStyle   = s.color;
            tctx.lineWidth   = s.width;
            tctx.lineCap     = PEN_CAP[s.type] || 'round';
            tctx.lineJoin    = 'round';
            var pts = s.points;
            if (pts.length === 1) {
              tctx.beginPath();
              tctx.arc(pts[0].x, pts[0].y, Math.max(0.5, s.width / 2), 0, Math.PI * 2);
              tctx.fill();
            } else if (pts.length >= 2) {
              tctx.beginPath();
              tctx.moveTo(pts[0].x, pts[0].y);
              for (var k = 1; k < pts.length - 1; k++) {
                var mx = (pts[k].x + pts[k + 1].x) / 2;
                var my = (pts[k].y + pts[k + 1].y) / 2;
                tctx.quadraticCurveTo(pts[k].x, pts[k].y, mx, my);
              }
              tctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
              tctx.stroke();
            }
            tctx.globalAlpha = 1.0;
            tctx.globalCompositeOperation = 'source-over';
          }
          frame.appendChild(tc);

          var meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = 'Page ' + (idx + 1);

          var del = document.createElement('button');
          del.className = 'del';
          del.innerHTML = '&#8722;';
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            deletePage(idx);
          });

          row.appendChild(frame);
          row.appendChild(meta);
          row.appendChild(del);

          row.addEventListener('click', function () {
            goToPage(idx);
            closeOverlay(pagesOverlay);
          });

          list.appendChild(row);
        })(i, nb.pages[i]);
      }
    }

    /* ---------- Color picker ---------- */
    function renderColorPicker() {
      var grid = document.getElementById('colorGrid');
      grid.innerHTML = '';
      for (var i = 0; i < COLOR_PALETTE.length; i++) {
        (function (color) {
          var cell = document.createElement('div');
          cell.className = 'color-cell';
          var inner = document.createElement('div');
          inner.className = 'color-cell-inner' + (color === currentColor ? ' active' : '');
          var fill = document.createElement('div');
          fill.className = 'fill';
          fill.style.background = color;
          if (color === '#ffffff') fill.style.border = '1px solid #cccccc';
          inner.appendChild(fill);
          cell.appendChild(inner);
          cell.addEventListener('click', function () {
            setColor(color);
            closeOverlay(colorOverlay);
          });
          grid.appendChild(cell);
        })(COLOR_PALETTE[i]);
      }
    }

    /* ---------- Size picker ---------- */
    function renderSizePicker() {
      var list = document.getElementById('sizeList');
      list.innerHTML = '';
      for (var i = 0; i < SIZE_PRESETS.length; i++) {
        (function (idx, preset) {
          var row = document.createElement('div');
          row.className = 'size-row' + (idx === currentSize ? ' active' : '');
          var dot = document.createElement('div');
          dot.className = 'dot';
          var circle = document.createElement('div');
          circle.className = 'circle';
          var dotSize = Math.max(4, preset.w * 2.2);
          circle.style.width  = dotSize + 'px';
          circle.style.height = dotSize + 'px';
          dot.appendChild(circle);
          var lbl = document.createElement('div');
          lbl.className = 'lbl';
          lbl.textContent = preset.name + ' (' + preset.w + ' px)';
          row.appendChild(dot);
          row.appendChild(lbl);
          row.addEventListener('click', function () {
            setSize(idx);
            closeOverlay(sizeOverlay);
          });
          list.appendChild(row);
        })(i, SIZE_PRESETS[i]);
      }
    }

    /* ---------- Tool / color / size state ---------- */
    function setTool(tool) {
      currentTool = tool;
      var btns = toolbarEl.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) {
        var b = btns[i];
        if (b.className.indexOf('tool-btn') >= 0) {
          var t = b.getAttribute('data-tool');
          if (t === tool) b.className = 'tool-btn active';
          else if (t) b.className = 'tool-btn';
        }
      }
      updateSizeDot();
    }
    function setColor(color) {
      currentColor = color;
      colorDotEl.style.background = color;
      if (currentTool === 'eraser') setTool('pen');
    }
    function setSize(idx) {
      currentSize = idx;
      updateSizeDot();
      if (currentTool === 'eraser') setTool('pen');
    }
    function updateSizeDot() {
      var dot = document.getElementById('sizeBtn').getElementsByTagName('span')[0];
      var preset = SIZE_PRESETS[currentSize];
      var w = Math.max(6, preset.w * 1.4);
      var mult = PEN_WIDTH_MULT[currentTool] || 1.0;
      w = Math.max(6, preset.w * mult * 1.4);
      dot.style.width  = w + 'px';
      dot.style.height = w + 'px';
      dot.style.borderRadius = (w / 2) + 'px';
      dot.style.background = currentTool === 'eraser' ? '#ffffff' : currentColor;
    }

    function updatePageIndicator() {
      var nb = notebooks[currentNotebook];
      var total = nb ? nb.pages.length : 1;
      if (pageIndEl) pageIndEl.textContent = (currentPage + 1) + ' / ' + total;
    }

    /* ---------- Overlay helpers ---------- */
    function openOverlay(o)  { o.className = 'overlay active'; }
    function closeOverlay(o) { o.className = 'overlay'; }

    /* ---------- Dark mode ---------- */
    function applyDarkMode() {
      if (darkMode) document.body.className = 'dark';
      else document.body.className = '';
      var darkBtn = document.getElementById('darkToggle');
      if (darkBtn) darkBtn.innerHTML = darkMode ? '&#9728;' : '&#9790;';
    }
    function toggleDarkMode() {
      darkMode = !darkMode;
      applyDarkMode();
      saveToStorage();
      if (drawView.className.indexOf('active') >= 0) renderPage();
    }

    /* ============================================================
       SECTION C — BOOT / EVENT WIRING
       ============================================================ */
    function bindButton(el, handler) {
      var lastTouch = 0;
      el.addEventListener('touchstart', function (e) {
        e.preventDefault();
        e.stopPropagation();
        lastTouch = Date.now();
        handler();
      }, false);
      el.addEventListener('click', function (e) {
        e.preventDefault();
        if (Date.now() - lastTouch < 600) return;
        handler();
      }, false);
    }
    function bindTapAndLongPress(el, onTap, onLong) {
      var timer = null;
      var started = 0;
      var moved = false;
      var lastX = 0, lastY = 0;
      el.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) return;
        started = Date.now();
        moved = false;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        var self = this;
        timer = setTimeout(function () {
          timer = null;
          if (!moved) {
            e.preventDefault();
            onLong();
          }
        }, 550);
      }, false);
      el.addEventListener('touchmove', function (e) {
        if (e.touches.length !== 1) return;
        var dx = e.touches[0].clientX - lastX;
        var dy = e.touches[0].clientY - lastY;
        if (dx * dx + dy * dy > 100) moved = true;
        if (moved && timer) { clearTimeout(timer); timer = null; }
      }, false);
      el.addEventListener('touchend', function (e) {
        if (timer) {
          clearTimeout(timer);
          timer = null;
          e.preventDefault();
          onTap();
        }
      }, false);
      /* Mouse fallback for desktop */
      el.addEventListener('click', function (e) {
        /* touchend already handled this */
        if (Date.now() - started < 100) return;
        onTap();
      }, false);
    }

    function initUI() {
      canvas      = document.getElementById('canvas');
      ctx         = canvas.getContext('2d');
      canvasWrap  = document.querySelector('.canvas-wrap');
      toolbarEl   = document.getElementById('toolbar');
      warningEl   = document.getElementById('warning');
      pageIndEl   = document.getElementById('pageInd');
      nbNameEl    = document.getElementById('nbName');
      homeView    = document.getElementById('homeView');
      drawView    = document.getElementById('drawView');
      notebookGrid = document.getElementById('notebookGrid');
      pagesOverlay  = document.getElementById('pagesOverlay');
      colorOverlay  = document.getElementById('colorOverlay');
      sizeOverlay   = document.getElementById('sizeOverlay');
      exportOverlay = document.getElementById('exportOverlay');
      exportImg     = document.getElementById('exportImg');
      colorDotEl    = document.getElementById('colorDot');

      /* Tool buttons */
      var toolBtns = toolbarEl.getElementsByClassName('tool-btn');
      for (var i = 0; i < toolBtns.length; i++) {
        var b = toolBtns[i];
        var t = b.getAttribute('data-tool');
        if (!t) continue;
        (function (tool, btn) {
          bindButton(btn, function () { setTool(tool); });
        })(t, b);
      }

      /* Action buttons */
      bindButton(document.getElementById('undoBtn'),   undo);
      bindButton(document.getElementById('redoBtn'),   redo);
      bindButton(document.getElementById('clearBtn'),  clearPage);
      bindButton(document.getElementById('exportBtn'), exportPNG);

      /* Color + size buttons open popovers */
      bindButton(document.getElementById('colorBtn'), function () {
        renderColorPicker();
        openOverlay(colorOverlay);
      });
      bindButton(document.getElementById('sizeBtn'), function () {
        renderSizePicker();
        openOverlay(sizeOverlay);
      });

      /* Top bar */
      bindButton(document.getElementById('backBtn'), function () {
        endStroke();
        showView('home');
      });
      bindButton(document.getElementById('pagesBtn'), function () {
        refreshPagesList();
        openOverlay(pagesOverlay);
      });
      bindButton(document.getElementById('addPageBtn'), function () {
        addPage();
        closeOverlay(pagesOverlay);
      });

      /* Overlay closers */
      bindButton(document.getElementById('pagesClose'),  function () { closeOverlay(pagesOverlay); });
      bindButton(document.getElementById('colorClose'),  function () { closeOverlay(colorOverlay); });
      bindButton(document.getElementById('sizeClose'),   function () { closeOverlay(sizeOverlay); });
      bindButton(document.getElementById('exportCloseBtn'), function () { closeOverlay(exportOverlay); exportImg.src = ''; });
      bindButton(document.getElementById('exportDoneBtn'), function () { closeOverlay(exportOverlay); exportImg.src = ''; });

      /* Home view */
      bindButton(document.getElementById('newNotebookBtn'), createNotebook);
      bindButton(document.getElementById('darkToggle'), toggleDarkMode);

      /* Tap outside a sheet closes it */
      pagesOverlay.addEventListener('click', function (e) { if (e.target === pagesOverlay) closeOverlay(pagesOverlay); });
      colorOverlay.addEventListener('click', function (e) { if (e.target === colorOverlay) closeOverlay(colorOverlay); });
      sizeOverlay.addEventListener('click',  function (e) { if (e.target === sizeOverlay)  closeOverlay(sizeOverlay); });
      exportOverlay.addEventListener('click', function (e) { if (e.target === exportOverlay) { closeOverlay(exportOverlay); exportImg.src = ''; } });

      setTool('pen');
      setColor('#000000');
      setSize(2);
      applyDarkMode();
    }

    function init() {
      initUI();
      initCanvasEvents();
      initGlobalEvents();
      loadFromStorage();
      renderHome();
      resizeCanvas();
      renderPage();
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    } else {
      document.addEventListener('DOMContentLoaded', init, false);
    }
  })();
  </script>
</body>
