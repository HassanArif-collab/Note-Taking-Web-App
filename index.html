  if (st.state === 'ink' && settings.palmLevel !== PALM_OFF) {
    /* a contender that earned ink evicts the stroke it was competing
       with, so a palm can never hold the pen hostage */
    if (st.contender) {
      var own = inkOwners(), oi;
      for (oi = 0; oi < own.length; oi++) {
        if (inkOwnerLosesTo(own[oi], st, now)) discardActiveInk(own[oi], now, 'usurped');
      }
    }
    /* promotion: any other live probes become palm forever */
    var k;
    for (k in touchStates) {
      if (!touchStates.hasOwnProperty(k)) continue;
      var o = touchStates[k];
      if (o !== st && o.kind === 'probe' && o.state === 'probe') verdictPalm(o, now);
    }
    hidePendingDot(st.id);
    prunePalmMemNear(st.sx, st.sy);
    if (!settings.scrollHintShown) {
      settings.scrollHintShown = true;
      toast('Tip: scroll with two fingers or the hand tool');
      saveSoon();
    }
  }
  requestRender();
}

function verdictPalm(st, now) {
  if (st.state === 'palm') return;
  st.state = 'palm';
  traceVerdict('palm', st.id, now);
  palmMemAdd(st.sx, st.sy, now);
  if (pendingDotId === st.id && settings.guideDots) flashRejectedDot();
  else if (pendingDotId === st.id) hidePendingDot(st.id);
}

function moveTouch(touch, now) {
  var st = touchStates[touch.identifier];
  if (!st) return;
  var pt = docPoint(touch);

  if (st.kind === 'erase') {
    st.x = pt.x; st.y = pt.y;
    if (!st.live && dist(st.sx, st.sy, pt.x, pt.y) > 3) st.live = true;
    if (st.live) eraseAt(pt.x, pt.y);
    requestRender();
    return;
  }
  if (st.kind === 'gesture') { st.cx = touch.clientX; st.cy = touch.clientY; return; }
  if (st.kind === 'selignore') { st.cx = touch.clientX; st.cy = touch.clientY; return; }
  if (st.kind === 'selscale') {
    st.x = pt.x; st.y = pt.y;
    st.cx = touch.clientX; st.cy = touch.clientY;
    var sd = dist(st.ax, st.ay, pt.x, pt.y);
    var k = sd / st.d0;
    if (k < 0.15) k = 0.15;
    if (k > 8) k = 8;
    st.k = k;
    if (!st.live && (k > 1.06 || k < 0.94)) {
      st.live = true;
      hideSelectedFromTiles();
    }
    if (st.live) requestRender();
    return;
  }
  if (st.kind === 'texttap') {
    st.moved += dist(st.x, st.y, pt.x, pt.y);
    st.x = pt.x; st.y = pt.y;
    st.cx = touch.clientX; st.cy = touch.clientY;
    return;
  }
  if (st.kind === 'selmove') {
    st.dx = pt.x - st.sx;
    st.dy = pt.y - st.sy;
    if (!st.live && Math.abs(st.dx) + Math.abs(st.dy) > 4) {
      st.live = true;
      hideSelectedFromTiles();
    }
    requestRender();
    return;
  }
  if (st.kind === 'lasso') {
    var last = st.path[st.path.length - 1];
    if (dist(last[0], last[1], pt.x, pt.y) > 3) st.path.push([pt.x, pt.y]);
    if (!st.active && dist(st.sx, st.sy, pt.x, pt.y) > 12) st.active = true;
    st.x = pt.x; st.y = pt.y;
    st.cx = touch.clientX; st.cy = touch.clientY;
    requestRender();
    return;
  }
  if (st.state === 'palm') {
    /* client coords must keep tracking even for a rejected contact:
       the pinch detector measures the separation between two contacts,
       and freezing cx/cy here made that separation constant, so a
       pinch could never be seen while anything was inking */
    st.x = pt.x; st.y = pt.y;
    st.cx = touch.clientX; st.cy = touch.clientY;
    return;
  }
  if (st.state === 'ink') { appendInk(st, pt, now, touch); return; }

  /* --- probe update ---
     Travel and speed are measured in SCREEN space, not document
     space. docPoint() divides by the live zoom and adds the live
     scroll, so a document-space measurement makes a completely
     stationary contact appear to travel whenever the page moves.
     A palm-triggered zoom then inflates a resting palm's travel
     until it commits as ink - the palm writes by itself without
     ever having moved. Screen pixels are also the honest unit for
     these thresholds: they describe physical hand movement. */
  var dt = Math.max(now - st.lastT, 1);
  var pcx = st.cx, pcy = st.cy;
  var cd = dist(pcx, pcy, touch.clientX, touch.clientY);
  st.x = pt.x; st.y = pt.y; st.lastT = now;
  st.cx = touch.clientX; st.cy = touch.clientY;
  st.path.push([pt.x, pt.y, now]);
  if (st.path.length > 400) st.path.shift();
  if (now - st.t0 < SC.SETTLE_MS) {
    /* still settling: keep the anchor under the contact so none of the
       landing excursion is mistaken for travel */
    st.csx = st.cx; st.csy = st.cy;
    st.net = 0;
    return;
  }

  st.net = dist(st.csx, st.csy, st.cx, st.cy);
  var v = cd / Math.max(dt, 4);

  /* a centroid hop is not travel */
  if (isJump(st, cd, v)) {
    st.jumps++;
  } else {
    /* a run of exactly one hop, with normal samples either side, is a
       blob snapping between lobes rather than a hand accelerating */
    if (st.jumps === 1) st.isoJumps++;
    st.jumps = 0;
    st.pathLen += cd;
    pushSpeed(st, v);
  }
  if (st.isoJumps >= SC.JUMP_PALM) { verdictPalm(st, now); return; }

  if (cd > 0.05) {
    var ux = (st.cx - pcx) / cd, uy = (st.cy - pcy) / cd;
    st.dirs.push([ux, uy]);
    if (st.dirs.length > 8) st.dirs.shift();
    var sx = 0, sy = 0, i;
    for (i = 0; i < st.dirs.length; i++) { sx += st.dirs[i][0]; sy += st.dirs[i][1]; }
    st.coh = Math.sqrt(sx * sx + sy * sy) / st.dirs.length;
  }

  if (settings.palmLevel !== PALM_OFF) tryCommit(st, now);
}

function tryCommit(st, now) {
  /* Until the window is full the median is not yet meaningful, and
     FAST and DECISIVE had no age gate at all - so one centroid jump
     could commit a contact that had barely existed. */
  if (st.sp.length < SPEED_WIN) return;
  var age = now - st.t0;
  var boost = st.suspect ? SC.SUSPECT_BOOST : 1;
  if (settings.palmLevel === PALM_STRICT) boost *= SC.STRICT_SPEED;
  var needAge = SC.PROBE_MIN_AGE * (st.suspect ? SC.SUSPECT_AGE_MULT : 1);

  /* A suspect dragging in a dead-straight line is a palm sliding,
     not handwriting - real writing curves and changes direction.
     Only suspects are vetoed, so a deliberate straight pen stroke
     (a fraction bar, a minus sign) is never blocked. */
  var straight = st.net / Math.max(st.pathLen, 1);
  if (st.suspect && st.pathLen > SC.VETO_PATH &&
      straight > SC.VETO_STRAIGHT && st.vel < SC.VETO_SPEED) {
    if (age > SC.PALM_AGE) verdictPalm(st, now);
    return;
  }

  if ((age > needAge && st.vel > SC.COMMIT_SPEED * boost &&
       st.coh > SC.COMMIT_COH && st.net > SC.COMMIT_NET * boost) ||
      (st.net > SC.FAST_NET * boost && st.vel > SC.FAST_SPEED * boost) ||
      (st.net > SC.DECISIVE_NET * boost && st.vel > SC.DECISIVE_SPEED * boost)) {
    promoteInk(st, now);
    return;
  }

  /* palm verdict: old, slow, and barely travelled */
  if (age > SC.PALM_AGE && st.net < 10 && (st.vel < SC.PALM_IDLE || age > SC.PALM_SIT_AGE)) {
    verdictPalm(st, now);
  } else if (age > SC.PALM_SIT_AGE && st.net < SC.PALM_SIT_NET) {
    verdictPalm(st, now);
  }
}

function promoteInk(st, now) {
  st.state = 'ink';
  traceVerdict('ink', st.id, now);
  startInkRecord(st, now);
}

function appendInk(st, pt, now, touch) {
  var ink = inkNow[st.id];
  if (!ink) return;
  var s = ink.stroke;
  var dt = Math.max(now - st.lastT, 1);
  var cx = touch ? touch.clientX : st.cx, cy = touch ? touch.clientY : st.cy;
  var cd = dist(st.cx, st.cy, cx, cy);
  st.x = pt.x; st.y = pt.y; st.lastT = now;
  st.cx = cx; st.cy = cy;
  s.pts.push([pt.x, pt.y, now]);
  st.pathLen += cd;
  st.net = dist(st.csx, st.csy, cx, cy);
  pushSpeed(st, cd / Math.max(dt, 4));

  /* incremental live segment (one per move, never the tail) */
  var k = s.pts.length - 1;
  if (k >= 2) {
    ctx.save();
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -dpr * zoom * scrollX, -dpr * zoom * scrollY);
    ctx.globalAlpha = s.a;
    ctx.strokeStyle = s.color;
    ctx.lineCap = penCap(s.pen);
    ctx.lineJoin = 'round';
    drawSmoothSeg(ctx, s, k - 1);
    ctx.restore();
  }

  /* mid-stroke palm discard (Max only) */
  if (settings.palmLevel >= PALM_MAX && s.pts.length > 6) {
    var age = now - st.t0;
    var straight = st.net / Math.max(st.pathLen, 1);
    if (age > SC.DISCARD_MS && st.pathLen > SC.DISCARD_PATH &&
        st.vel < SC.DISCARD_SPEED && straight > SC.DISCARD_STRAIGHT) {
      discardActiveInk(st, now);
      return;
    }

    /* dwell: the stroke stopped going anywhere but the finger never
       lifted. Anchor on the last position that mattered; any real
       progress moves out of the circle and re-anchors. */
    if (!st.dwellAt || dist(st.dwellAt.x, st.dwellAt.y, cx, cy) > SC.DWELL_RADIUS) {
      st.dwellAt = { x: cx, y: cy, t: now };
    } else if (now - st.dwellAt.t > SC.DWELL_MS && st.pathLen > SC.DWELL_MIN_PATH) {
      discardActiveInk(st, now, 'dwell');
    }
  }
}

function discardActiveInk(st, now, why) {
  delete inkNow[st.id];
  st.state = 'palm';
  traceVerdict(why === 'pinch' ? 'pinch-cancel' : (why || 'discarded'), st.id, now);
  palmMemAdd(st.sx, st.sy, now);
  /* a pinch is the user asking to zoom - dropping the stroke is the
     point, not an error worth interrupting them about */
  if (why === 'pinch') { requestRender(); return; }
  toast(why === 'usurped' ? 'Palm stroke removed - pen took over'
                          : 'Palm stroke discarded');
  requestRender();
}

function finalizeInk(st, now) {
  var ink = inkNow[st.id];
  delete inkNow[st.id];
  if (!ink) return;
  var s = ink.stroke;
  var n = activeNote();
  if (!n) return;
  /* shape assist mutates the points before the stroke lands in
     the document, so undo is a plain remove (v4 semantics) */
  if (settings.shapeAssist !== SHAPE_OFF && s.pen !== PEN_TEXT && s.pts.length > 4) {
    tryReshape(s);
  }
  n.strokes.push(s);
  pushUndo({ t: 'add', s: s });
  var lp = s.pts[s.pts.length - 1];
  lastInkPt = { x: lp[0], y: lp[1], t: now };
  var bb = strokeBBox(s);
  invalidateRange(bb.y0, bb.y1);
  recomputeDoc();
  saveSoon();
  requestRender();
}

/* A quick stationary contact is ambiguous: it is either a
 * deliberate dot (a decimal point, an i) or a palm brushing the
 * glass. The old guard was st.rx > 12, but an iPad 3 always
 * reports radiusX 0, so on this hardware it was dead code and
 * every palm tap left a dot.
 *
 * A deliberate dot is placed where you are already writing; a palm
 * lands away from the pen. So a dot must be recent and near the
 * last ink, and must not already be a suspect. */
function dotIsCredible(st, now) {
  if (st.suspect) return false;
  if (st.rx > 12) return false;
  if (!lastInkPt) return false;
  if (now - lastInkPt.t > SC.DOT_NEAR_MS) return false;
  return dist(lastInkPt.x, lastInkPt.y, st.sx, st.sy) < SC.DOT_NEAR_PX;
}

function queueTapDot(st, now) {
  if (!dotIsCredible(st, now)) { palmMemAdd(st.sx, st.sy, now); return; }
  if (dotQueue && dist(dotQueue.x, dotQueue.y, st.sx, st.sy) < SC.BOUNCE_PX) {
    /* bounce: cancel the queued dot, remember the chain */
    clearTimeout(dotQueue.timer);
    dotQueue = null;
    lastBounce = { x: st.sx, y: st.sy, t: now };
    palmMemAdd(st.sx, st.sy, now);
    return;
  }
  if (dotQueue) { flushDot(dotQueue); dotQueue = null; }
  var q = { x: st.sx, y: st.sy, t: now, timer: null };
  q.timer = setTimeout(function () {
    if (dotQueue === q) dotQueue = null;
    flushDot(q);
  }, SC.BOUNCE_MS);
  dotQueue = q;
}

function flushDot(q) {
  var n = activeNote();
  if (!n) return;
  traceVerdict('dot', -1, q.t);
  var s = mkStroke(settings.pen, currentPenWidth(), settings.color, [[q.x, q.y, q.t]]);
  n.strokes.push(s);
  lastInkPt = { x: q.x, y: q.y, t: q.t };
  pushUndo({ t: 'add', s: s });
  var bb = strokeBBox(s);
  invalidateRange(bb.y0, bb.y1);
  recomputeDoc();
  saveSoon();
  requestRender();
}

function endTouch(touch, now, cancelled) {
  var st = touchStates[touch.identifier];
  if (!st) return;
  delete touchStates[touch.identifier];

  if (st.kind === 'erase') {
    if (eraserTouchId === st.id) eraserTouchId = null;
    requestRender();
    return;
  }
  if (st.kind === 'gesture') {
    /* hand-tool tap? check double-tap = reset zoom */
    if (gesture && gesture.fromHand && !cancelled &&
        now - st.t0 < 300 && dist(st.sx, st.sy, st.cx, st.cy) < 10) {
      if (lastHandTap && now - lastHandTap.t < 400 &&
          dist(lastHandTap.x, lastHandTap.y, st.sx, st.sy) < 44) {
        lastHandTap = null;
        gestureMemberEnd(now);
        resetZoom();
        return;
      }
      lastHandTap = { t: now, x: st.sx, y: st.sy };
    }
    gestureMemberEnd(now);
    return;
  }
  if (st.kind === 'texttap') {
    if (!cancelled && now - st.t0 < 450 && st.moved < 8) openTextEditor(st.sx, st.sy);
    return;
  }
  if (st.kind === 'selmove') {
    if (selDrag === st) selDrag = null;
    commitSelMove(st);
    return;
  }
  if (st.kind === 'selscale') {
    if (selScale === st) selScale = null;
    commitSelScale(st);
    return;
  }
  if (st.kind === 'selignore') return;
  if (st.kind === 'lasso') {
    if (lassoId === st.id) lassoId = null;
    if (cancelled || !st.active) {
      /* a plain tap with the select tool clears the selection */
      clearSelection();
      requestRender();
    } else {
      resolveSelection(st.path);
    }
    return;
  }
  if (st.state === 'ink') {
    /* iOS cancels a contact when it decides the touch was spurious -
       a hand landing, too many contacts, a system gesture taking over.
       That is the digitizer telling us this was not a deliberate
       stroke, and the old code committed it anyway. Cancel is the one
       piece of palm evidence the hardware hands us for free. */
    if (cancelled) {
      delete inkNow[st.id];
      traceVerdict('cancelled', st.id, now);
      palmMemAdd(st.sx, st.sy, now);
      requestRender();
      return;
    }
    finalizeInk(st, now);
    return;
  }

  /* probe that never earned ink */
  var age = now - st.t0;
  if (st.state === 'palm' || cancelled) {
    palmMemAdd(st.sx, st.sy, now);
  } else if (age < SC.TAP_MS && st.pathLen < 5) {
    queueTapDot(st, now);
  } else {
    palmMemAdd(st.sx, st.sy, now);
  }
  if (pendingDotId === st.id) hidePendingDot(st.id);
}

/* ---------- gesture engine: pan + pinch-zoom + momentum ---------- */
function recentVec(o, now) {
  var p = o.path, m = p.length;
  if (m < 2) return null;
  var i = m - 1;
  while (i > 0 && now - p[i - 1][2] < 120) i--;
  var dx = p[m - 1][0] - p[i][0], dy = p[m - 1][1] - p[i][1];
  var dt = Math.max(now - p[i][2], 16);
  return { dx: dx, dy: dy, v: Math.sqrt(dx * dx + dy * dy) / dt };
}

function angDiff(a, b) {
  var d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

function gestureMembers() {
  var out = [], k;
  for (k in touchStates) {
    if (!touchStates.hasOwnProperty(k)) continue;
    if (touchStates[k].kind === 'gesture') out.push(touchStates[k]);
  }
  return out;
}

function engageGesture(ids, now, pairDist) {
  var c = gestureCentroid(true);
  if (!c) return;
  var i, o;
  gesture = {
    lastCx: c.x, lastCy: c.y,
    lastD: pairDist || 0, lastT: now,
    vx: 0, vy: 0, fromHand: false, key: null
  };
  traceGesture('engage', ids.length, Math.round(pairDist || 0), now);
  for (i = 0; i < ids.length; i++) {
    o = touchStates[ids[i]];
    if (o && o.kind === 'probe' && o.state !== 'ink') {
      o.kind = 'gesture';
      if (pendingDotId === o.id) hidePendingDot(o.id);
    }
  }
  gesture.key = gestureMemberKey();
  hidePendingDot();
}

/* Contacts that could join a gesture: down, not already drawing. */
function nonInkProbes() {
  var out = [], k, o;
  for (k in touchStates) {
    if (!touchStates.hasOwnProperty(k)) continue;
    o = touchStates[k];
    if (o.kind === 'probe' && o.state !== 'ink') out.push(o);
  }
  return out;
}

function discardAllActiveInk(now) {
  var own = inkOwners(), i;
  for (i = 0; i < own.length; i++) discardActiveInk(own[i], now, 'pinch');
}

/* Pinch by measuring the separation between two contacts rather than
   by requiring both of them to be moving. A finger held still produces
   no movement vector, so the old test could never see the most natural
   pinch there is: one finger planted, the other sliding. */
var pinchTrack = null;

function tryPinch(now) {
  var p = nonInkProbes();
  if (p.length !== 2) { pinchTrack = null; return false; }
  var a = p[0], b = p[1];
  var d = dist(a.cx, a.cy, b.cx, b.cy);
  if (d < 40) { pinchTrack = null; return false; }

  /* Baseline the separation the moment the pair appears, NOT when it
     becomes old enough to act on. Waiting to take the baseline meant
     most of the pinch had already happened by then, leaving a delta
     of a couple of px - the gesture measured only its own tail. */
  var same = pinchTrack &&
    ((pinchTrack.a === a.id && pinchTrack.b === b.id) ||
     (pinchTrack.a === b.id && pinchTrack.b === a.id));
  if (!same) { pinchTrack = { a: a.id, b: b.id, d0: d }; return false; }

  /* flickering contacts never qualify */
  if (now - a.t0 < SC.PINCH_MIN_AGE || now - b.t0 < SC.PINCH_MIN_AGE) return false;
  if (Math.abs(d - pinchTrack.d0) < SC.PINCH_DELTA) return false;

  discardAllActiveInk(now);
  engageGesture([a.id, b.id], now, d);
  pinchTrack = null;
  return true;
}

function detectGesture(now) {
  if (gesture) return;
  if (tool !== 'pen') return;
  /* Every bail below is a two-finger gesture the user tried to make
     and did not get. "Sometimes it zooms, sometimes it doesn't" is
     diagnosed from these, so each reason is recorded - but only when
     at least two fingers are actually down, or the log would fill
     with ordinary single-touch writing. */
  if (settings.palmLevel === PALM_OFF) return;
  var live = liveTouchCount();

  /* Deliberate two-finger pinch outranks whatever is drawing. The old
     order refused every gesture while a stroke owned the pen, so a palm
     that falsely inked also disabled zoom - which is why "the palm
     draws" and "it won't zoom" were the same complaint. */
  if (tryPinch(now)) return;

  if (anyInkActive()) { if (live >= 2) traceGesture('bail-ink', live, 0, now); return; }

  var vecs = [], k, o, rv;
  for (k in touchStates) {
    if (!touchStates.hasOwnProperty(k)) continue;
    o = touchStates[k];
    if (o.kind !== 'probe' || o.state === 'ink') continue;
    rv = recentVec(o, now);
    if (rv && rv.v > SC.PAN_SPEED) vecs.push({ id: k, rv: rv });
  }
  if (vecs.length < 2) {
    /* a finger held still is not a "moving vector", so an anchored
       pinch - one finger planted, the other sliding - never reaches
       the tests below */
    if (live >= 2) traceGesture('bail-slow', live, vecs.length, now);
    return;
  }

  /* --- pinch candidate: exactly two probes separating / closing
         along the line that joins them (both moving fast) --- */
  if (vecs.length === 2) {
    var o1 = touchStates[vecs[0].id];
    var o2 = touchStates[vecs[1].id];
    var ax = o2.cx - o1.cx, ay = o2.cy - o1.cy;
    var al = Math.sqrt(ax * ax + ay * ay);
    if (al > 40) {
      ax /= al; ay /= al;
      var v1 = Math.sqrt(vecs[0].rv.dx * vecs[0].rv.dx + vecs[0].rv.dy * vecs[0].rv.dy);
      var v2 = Math.sqrt(vecs[1].rv.dx * vecs[1].rv.dx + vecs[1].rv.dy * vecs[1].rv.dy);
      if (v1 > 0.01 && v2 > 0.01) {
        var d1 = (vecs[0].rv.dx * ax + vecs[0].rv.dy * ay) / v1;
        var d2 = (vecs[1].rv.dx * ax + vecs[1].rv.dy * ay) / v2;
        if (d1 * d2 < -0.5) {
          engageGesture([vecs[0].id, vecs[1].id], now, al);
          return;
        }
      }
    }
  }

  /* --- pan candidate: all moving the same way (v4 logic) --- */
  var ang0 = Math.atan2(vecs[0].rv.dy, vecs[0].rv.dx);
  var ok = true, maxV = 0, minV = 1e9, i;
  for (i = 0; i < vecs.length; i++) {
    var a = Math.atan2(vecs[i].rv.dy, vecs[i].rv.dx);
    if (Math.abs(angDiff(a, ang0)) > SC.PAN_DEG * Math.PI / 180) { ok = false; break; }
    if (vecs[i].rv.v > maxV) maxV = vecs[i].rv.v;
    if (vecs[i].rv.v < minV) minV = vecs[i].rv.v;
  }
  if (!ok) { traceGesture('bail-angle', live, vecs.length, now); return; }
  if (maxV / Math.max(minV, 0.001) > SC.PAN_RATIO) {
    traceGesture('bail-ratio', live, Math.round(maxV / Math.max(minV, 0.001)), now);
    return;
  }

  var ids = [];
  for (i = 0; i < vecs.length; i++) ids.push(vecs[i].id);
  var ms = ids;
  var pair = 0;
  var mo1 = touchStates[ms[0]], mo2 = touchStates[ms[1]];
  if (mo1 && mo2) pair = dist(mo1.cx, mo1.cy, mo2.cx, mo2.cy);
  engageGesture(ids, now, pair);
}

function gestureCentroid(includeProbes) {
  /* screen coordinates: the centroid must NOT depend on scrollY,
     otherwise panning feeds back into itself */
  var cx = 0, cy = 0, n = 0, k;
  for (k in touchStates) {
    if (!touchStates.hasOwnProperty(k)) continue;
    var o = touchStates[k];
    if (o.kind === 'gesture') { cx += o.cx; cy += o.cy; n++; }
    else if (includeProbes && o.kind === 'probe' && o.state !== 'ink') { cx += o.cx; cy += o.cy; n++; }
  }
  if (!n) return null;
  return { x: cx / n, y: cy / n, n: n };
}

function gestureMemberKey() {
  var ms = gestureMembers(), ids = [], i;
  for (i = 0; i < ms.length; i++) ids.push(ms[i].id);
  ids.sort();
  return ids.join(',');
}

function applyGesture(now) {
  if (!gesture) return;
  var c = gestureCentroid(false);
  if (!c || c.n < 1) { gesture = null; return; }

  /* If the member set changed - a finger lifted, or a flickering palm
     contact replaced one - then lastD and lastCx describe a DIFFERENT
     pair of contacts than d and c do. Taking a ratio across the two is
     how the zoom used to jump 1.18 -> 1.96 in a single frame. Re-base
     on the new members and skip this frame instead. */
  var key = gestureMemberKey();
  if (key !== gesture.key) {
    var m0 = gestureMembers();
    gesture.key = key;
    gesture.lastCx = c.x; gesture.lastCy = c.y; gesture.lastT = now;
    gesture.lastD = m0.length >= 2 ? dist(m0[0].cx, m0[0].cy, m0[1].cx, m0[1].cy) : 0;
    return;
  }

  var dx = c.x - gesture.lastCx;
  var dy = c.y - gesture.lastCy;
  var dt = Math.max(now - gesture.lastT, 4);

  var ms = gestureMembers();

  /* --- pinch: scale around the finger centroid. The doc point
         under the centroid stays under the centroid. --- */
  if (ms.length >= 2) {
    var d = dist(ms[0].cx, ms[0].cy, ms[1].cx, ms[1].cy);
    if (gesture.lastD > 30 && d > 30) {
      /* no real pinch scales the page by more than a few percent in one
         frame; anything larger is a bad measurement, not a gesture */
      var f = lim(d / gesture.lastD, 0.85, 1.18);
      var nz = lim(zoom * f, Z_MIN, Z_MAX);
      var ax = (c.x - wrapRect.left) / zoom + scrollX;
      var ay = (c.y - wrapRect.top) / zoom + scrollY;
      zoom = nz;
      scrollX = ax - (c.x - wrapRect.left) / zoom;
      scrollY = ay - (c.y - wrapRect.top) / zoom;
    }
    gesture.lastD = d;
  }

  /* --- pan: the paper follows the centroid --- */
  scrollX -= dx / zoom;
  scrollY -= dy / zoom;

  gesture.vx = gesture.vx * 0.7 + (dx / dt) * 0.3;
  gesture.vy = gesture.vy * 0.7 + (dy / dt) * 0.3;
  gesture.lastCx = c.x; gesture.lastCy = c.y; gesture.lastT = now;
  clampScroll();
  traceView(now);
  requestRender();
}

function gestureMemberEnd(now) {
  var ms = gestureMembers();
  /* a hand-tool gesture survives with a single finger; a
     pen-tool gesture (pan/pinch) needs two */
  var need = (gesture && gesture.fromHand) ? 1 : 2;
  if (ms.length >= need) return;
  var vx = gesture ? gesture.vx : 0;
  var vy = gesture ? gesture.vy : 0;
  traceGesture('end', ms.length, 0, now);
  gesture = null;
  if (Math.abs(vy) > 0.06 || Math.abs(vx) > 0.06) startMomentum(vx, vy);
}

function startMomentum(vx, vy) {
  momentum = { vx: vx, vy: vy };
  if (!momRAF) momRAF = window.requestAnimationFrame(momStep);
}
function stopMomentum() { momentum = null; }

function momStep() {
  momRAF = 0;
  if (!momentum) return;
  scrollX -= momentum.vx * 16 / zoom;
  scrollY -= momentum.vy * 16 / zoom;
  var decay = Math.pow(SC.MOM_DECAY, 16 / 16);
  momentum.vx *= decay;
  momentum.vy *= decay;
  clampScroll();
  requestRender();
  if (Math.abs(momentum.vy) > 0.02 || Math.abs(momentum.vx) > 0.02) momRAF = window.requestAnimationFrame(momStep);
  else momentum = null;
}

/* ---------- eraser ---------- */
function segDist(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var L = dx * dx + dy * dy;
  if (L < 0.0001) return dist(px, py, x1, y1);
  var t = ((px - x1) * dx + (py - y1) * dy) / L;
  t = lim(t, 0, 1);
  return dist(px, py, x1 + t * dx, y1 + t * dy);
}

function eraseAt(x, y) {
  var n = activeNote();
  if (!n) return;
  var r = eraserSize / 2 + 2;
  var st = n.strokes;
  var hits = [], i, j;
  for (i = 0; i < st.length; i++) {
    var s = st[i];
    var bb = strokeBBox(s);
    if (x < bb.x0 - r || x > bb.x1 + r || y < bb.y0 - r || y > bb.y1 + r) continue;
    var hit = false;
    var p = s.pts;
    if (s.pen === PEN_TEXT) {
      /* text: erase when the cursor rectangle covers the text box */
      hit = (x + r > bb.x0 && x - r < bb.x1 && y + r > bb.y0 && y - r < bb.y1);
    } else if (p.length === 1) {
      hit = dist(x, y, p[0][0], p[0][1]) <= r + s.w;
    } else if (eraserMode === 1) {
      var cx = lim(x, bb.x0, bb.x1), cy = lim(y, bb.y0, bb.y1);
      hit = dist(x, y, cx, cy) <= r;
    } else {
      for (j = 1; j < p.length && !hit; j++) {
        if (segDist(x, y, p[j - 1][0], p[j - 1][1], p[j][0], p[j][1]) <= r + s.w / 2) hit = true;
      }
    }
    if (hit) hits.push(s);
  }
  if (hits.length) {
    for (i = 0; i < hits.length; i++) removeStroke(n, hits[i]);
    pushUndo({ t: 'erase', list: hits });
    saveSoon();
  }
}

function drawEraserCursor(c) {
  var st = touchStates[eraserTouchId];
  if (!st) return;
  c.save();
  c.beginPath();
  c.arc(st.x, st.y, eraserSize / 2 + 2, 0, 6.2832);
  c.strokeStyle = 'rgba(70,74,80,0.85)';
  c.lineWidth = 1.5;
  c.stroke();
  c.restore();
}

/* ============================================================
 * LASSO SELECTION (Samsung selection tool)
 * ============================================================ */
function ptInPoly(x, y, poly) {
  var inside = false, i, j;
  for (i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var xi = poly[i][0], yi = poly[i][1];
    var xj = poly[j][0], yj = poly[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function strokeInLasso(s, poly) {
  if (s.pen === PEN_TEXT) {
    var bb = strokeBBox(s);
    return ptInPoly((bb.x0 + bb.x1) / 2, (bb.y0 + bb.y1) / 2, poly);
  }
  var p = s.pts, n = p.length, inside = 0, i;
  if (!n) return false;
  for (i = 0; i < n; i++) {
    if (ptInPoly(p[i][0], p[i][1], poly)) inside++;
  }
  return inside * 2 >= n;   /* at least half the points inside */
}

function resolveSelection(path) {
  var n = activeNote();
  var hit = [];
  if (n && path.length > 2) {
    /* auto-close the loop */
    var closed = path.slice(0);
    if (dist(closed[0][0], closed[0][1], closed[closed.length - 1][0], closed[closed.length - 1][1]) > 6) {
      closed.push([closed[0][0], closed[0][1]]);
    }
    for (var i = 0; i < n.strokes.length; i++) {
      if (strokeInLasso(n.strokes[i], closed)) hit.push(n.strokes[i]);
    }
  }
  if (!hit.length) {
    clearSelection();
    requestRender();
    return;
  }
  selection = hit;
  selHidden = {};
  selBBox = selUnionBBox();
  positionSelBar();
  requestRender();
}

function selUnionBBox() {
  if (!selection.length) return null;
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, i;
  for (i = 0; i < selection.length; i++) {
    var bb = strokeBBox(selection[i]);
    if (bb.x0 < x0) x0 = bb.x0;
    if (bb.y0 < y0) y0 = bb.y0;
    if (bb.x1 > x1) x1 = bb.x1;
    if (bb.y1 > y1) y1 = bb.y1;
  }
  return { x0: x0 - 8, y0: y0 - 8, x1: x1 + 8, y1: y1 + 8 };
}

function hideSelectedFromTiles() {
  if (!selection.length) return;
  for (var i = 0; i < selection.length; i++) {
    var s = selection[i];
    selHidden[s.id] = 1;
    var bb = strokeBBox(s);
    invalidateRange(bb.y0, bb.y1);
  }
  requestRender();
}

function unhideSelectedFromTiles() {
  var any = false;
  for (var i = 0; i < selection.length; i++) {
    var s = selection[i];
    if (selHidden[s.id]) {
      delete selHidden[s.id];
      any = true;
      var bb = strokeBBox(s);
      invalidateRange(bb.y0, bb.y1);
    }
  }
  if (any) requestRender();
}

function shiftStroke(s, dx, dy) {
  var p = s.pts;
  for (var i = 0; i < p.length; i++) {
    p[i][0] += dx;
    p[i][1] += dy;
  }
  s.bb = null;
}

/* uniform scale of a stroke around anchor (ax, ay):
   points move, pen width grows/shrinks, text font size too */
function scaleStroke(s, ax, ay, k) {
  var p = s.pts, i;
  for (i = 0; i < p.length; i++) {
    p[i][0] = ax + (p[i][0] - ax) * k;
    p[i][1] = ay + (p[i][1] - ay) * k;
  }
  if (s.pen === PEN_TEXT) {
    var tw = s.tw || 100, th = s.th || s.sz * 1.32;
    s.sz = Math.max(6, s.sz * k);
    s.tw = tw * k;
    s.th = th * k;
  } else {
    s.w = Math.max(0.25, Math.min(80, s.w * k));
  }
  s.bb = null;
}

function applyScaleToSelection(list, ax, ay, k) {
  var i, bb;
  for (i = 0; i < list.length; i++) {
    bb = strokeBBox(list[i]);
    invalidateRange(bb.y0, bb.y1);
  }
  for (i = 0; i < list.length; i++) scaleStroke(list[i], ax, ay, k);
  for (i = 0; i < list.length; i++) {
    bb = strokeBBox(list[i]);
    invalidateRange(bb.y0, bb.y1);
  }
  pushUndo({ t: 'scale', list: list, ax: ax, ay: ay, k: k });
  recomputeDoc();
  unhideSelectedFromTiles();
  selBBox = selUnionBBox();
  positionSelBar();
  saveSoon();
  requestRender();
}

function commitSelScale(st) {
  if (!st.live) {
    /* tap on the handle: just restore the bar */
    selBBox = selUnionBBox();
    positionSelBar();
    requestRender();
    return;
  }
  if (Math.abs(st.k - 1) < 0.01) {
    unhideSelectedFromTiles();
    selBBox = selUnionBBox();
    positionSelBar();
    requestRender();
    return;
  }
  applyScaleToSelection(selection.slice(), st.ax, st.ay, st.k);
}

/* -/+ action bar buttons: scale around the selection center */
function scaleSelectionBy(k) {
  if (!selection.length || !selBBox) return;
  if (selDrag || selScale) return;
  var cx = (selBBox.x0 + selBBox.x1) / 2;
  var cy = (selBBox.y0 + selBBox.y1) / 2;
  applyScaleToSelection(selection.slice(), cx, cy, k);
}

function commitSelMove(st) {
  if (!st.live) {
    /* tap on the selection: just restore the bar */
    selBBox = selUnionBBox();
    positionSelBar();
    requestRender();
    return;
  }
  var dx = st.dx, dy = st.dy, i, s, bb;
  if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) {
    unhideSelectedFromTiles();
    selBBox = selUnionBBox();
    positionSelBar();
    requestRender();
    return;
  }
  for (i = 0; i < selection.length; i++) {
    bb = strokeBBox(selection[i]);
    invalidateRange(bb.y0, bb.y1);
  }
  for (i = 0; i < selection.length; i++) shiftStroke(selection[i], dx, dy);
  for (i = 0; i < selection.length; i++) {
    bb = strokeBBox(selection[i]);
    invalidateRange(bb.y0, bb.y1);
  }
  pushUndo({ t: 'move', list: selection.slice(), dx: dx, dy: dy });
  recomputeDoc();
  unhideSelectedFromTiles();
  selBBox = selUnionBBox();
  positionSelBar();
  saveSoon();
  requestRender();
}

function clearSelection() {
  var hadHidden = false, k;
  for (k in selHidden) {
    if (selHidden.hasOwnProperty(k)) { hadHidden = true; break; }
  }
  selection = [];
  selHidden = {};
  selBBox = null;
  selDrag = null;
  selScale = null;
  hideSelBar();
  if (hadHidden) { invalidateAll(); requestRender(); }
}

function positionSelBar() {
  if (!selection.length || !selBBox || selDrag || selScale) { hideSelBar(); return; }
  selBarEl.style.display = 'block';
  var bw = selBarEl.offsetWidth || 150;
  var sp = docToScreen((selBBox.x0 + selBBox.x1) / 2, selBBox.y0);
  var left = sp.x - bw / 2;
  if (left < 10) left = 10;
  if (left > viewW - bw - 10) left = viewW - bw - 10;
  var top = sp.y - 56;
  if (top < 62) top = 62;
  if (top > viewH - 20) top = viewH - 20;
  selBarEl.style.left = left + 'px';
  selBarEl.style.top = top + 'px';
}
function hideSelBar() { selBarEl.style.display = 'none'; }

function deleteSelection() {
  var n = activeNote();
  if (!n || !selection.length) return;
  var list = selection.slice();
  for (var i = 0; i < list.length; i++) removeStroke(n, list[i]);
  pushUndo({ t: 'erase', list: list });
  selection = [];
  selHidden = {};
  selBBox = null;
  hideSelBar();
  recomputeDoc();
  saveSoon();
  requestRender();
  toast(list.length + (list.length === 1 ? ' item deleted' : ' items deleted'));
}

function duplicateSelection() {
  var n = activeNote();
  if (!n || !selection.length) return;
  var clones = [], i, s;
  for (i = 0; i < selection.length; i++) {
    s = selection[i];
    var pts = [];
    for (var j = 0; j < s.pts.length; j++) {
      pts.push([s.pts[j][0] + 26, s.pts[j][1] + 26, s.pts[j][2]]);
    }
    var c = { id: genId(), pen: s.pen, w: s.w, color: s.color, a: s.a, ord: strokeSeq++, pts: pts };
    if (s.pen === PEN_TEXT) {
      c.txt = s.txt; c.sz = s.sz; c.tw = s.tw; c.th = s.th;
    }
    clones.push(c);
    addStroke(n, c);
  }
  pushUndo({ t: 'adds', list: clones });
  selection = clones;
  selHidden = {};
  selBBox = selUnionBBox();
  positionSelBar();
  recomputeDoc();
  saveSoon();
  requestRender();
  toast('Duplicated');
}

/* ---------- selection + lasso rendering ---------- */
function drawSelectionOverlays(c) {
  /* live lasso path */
  if (lassoId !== null && touchStates[lassoId] && touchStates[lassoId].active) {
    var path = touchStates[lassoId].path;
    c.save();
    c.strokeStyle = 'rgba(3,129,254,0.85)';
    c.lineWidth = 1.6 / zoom;
    if (c.setLineDash) c.setLineDash([7 / zoom, 5 / zoom]);
    c.beginPath();
    c.moveTo(path[0][0], path[0][1]);
    for (var li = 1; li < path.length; li++) c.lineTo(path[li][0], path[li][1]);
    c.lineTo(path[0][0], path[0][1]);
    c.stroke();
    if (c.setLineDash) c.setLineDash([]);
    c.restore();
  }

  if (!selection.length || !selBBox) return;

  var dragSt = (selDrag && selDrag.live) ? selDrag : null;
  var sclSt = (selScale && selScale.live) ? selScale : null;
  var rx0 = selBBox.x0, ry0 = selBBox.y0, rx1 = selBBox.x1, ry1 = selBBox.y1;

  if (dragSt) {
    rx0 += dragSt.dx; rx1 += dragSt.dx;
    ry0 += dragSt.dy; ry1 += dragSt.dy;
  } else if (sclSt) {
    rx1 = sclSt.ax + (rx1 - sclSt.ax) * sclSt.k;
    ry1 = sclSt.ay + (ry1 - sclSt.ay) * sclSt.k;
  }

  c.save();
  if (dragSt) {
    /* moved copies drawn live (originals are off the tiles) */
    c.translate(dragSt.dx, dragSt.dy);
    for (var si = 0; si < selection.length; si++) renderStrokeFull(c, selection[si]);
  } else if (sclSt) {
    /* scaled copies drawn live around the anchor corner */
    c.translate(sclSt.ax, sclSt.ay);
    c.scale(sclSt.k, sclSt.k);
    c.translate(-sclSt.ax, -sclSt.ay);
    for (var sj = 0; sj < selection.length; sj++) renderStrokeFull(c, selection[sj]);
  }
  c.restore();

  /* highlight rectangle + dashed border */
  c.save();
  c.fillStyle = 'rgba(3,129,254,0.07)';
  c.fillRect(rx0, ry0, rx1 - rx0, ry1 - ry0);
  c.strokeStyle = 'rgba(3,129,254,0.9)';
  c.lineWidth = 1.4 / zoom;
  if (c.setLineDash) c.setLineDash([8 / zoom, 5 / zoom]);
  c.strokeRect(rx0, ry0, rx1 - rx0, ry1 - ry0);
  if (c.setLineDash) c.setLineDash([]);

  /* resize handle on the bottom-right corner (Samsung-style) */
  if (!dragSt) {
    var hr = Math.max(5.5, 7 / zoom);
    c.fillStyle = '#FFFFFF';
    c.strokeStyle = '#0381FE';
    c.lineWidth = 1.6 / zoom;
    c.beginPath();
    c.arc(rx1, ry1, hr, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    /* tiny diagonal double arrow = "drag to resize" */
    var dIn = hr * 0.5, dOut = hr * 0.38;
    c.beginPath();
    c.moveTo(rx1 - dIn, ry1 - dIn);
    c.lineTo(rx1 + dIn, ry1 + dIn);
    c.moveTo(rx1 + dIn, ry1 + dIn);
    c.lineTo(rx1 + dIn - dOut, ry1 + dIn);
    c.moveTo(rx1 + dIn, ry1 + dIn);
    c.lineTo(rx1 + dIn, ry1 + dIn - dOut);
    c.moveTo(rx1 - dIn, ry1 - dIn);
    c.lineTo(rx1 - dIn + dOut, ry1 - dIn);
    c.moveTo(rx1 - dIn, ry1 - dIn);
    c.lineTo(rx1 - dIn, ry1 - dIn + dOut);
    c.stroke();
  }
  c.restore();
}

/* ============================================================
 * SHAPE ASSIST (Samsung shape recognition)
 * Runs on stroke finish when enabled; mutates the stroke points
 * before it is committed, so plain undo still works.
 * ============================================================ */
function tryReshape(s) {
  var p = s.pts, n = p.length;
  if (n < 5) return false;

  /* stroke metrics */
  var pathLen = 0, i;
  for (i = 1; i < n; i++) pathLen += dist(p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]);
  if (pathLen < 30) return false;
  var net = dist(p[0][0], p[0][1], p[n - 1][0], p[n - 1][1]);
  var straight = net / pathLen;

  /* 1. LINE: nearly straight travel (either mode) */
  if (straight > 0.88 && net > 24) {
    s.pts = [p[0], p[n - 1]];
    return true;
  }

  if (settings.shapeAssist !== SHAPE_SHAPE) return false;

  /* bbox + closure */
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (i = 0; i < n; i++) {
    if (p[i][0] < x0) x0 = p[i][0];
    if (p[i][1] < y0) y0 = p[i][1];
    if (p[i][0] > x1) x1 = p[i][0];
    if (p[i][1] > y1) y1 = p[i][1];
  }
  var w = x1 - x0, h = y1 - y0;
  if (w < 18 || h < 18) return false;
  var diag = Math.sqrt(w * w + h * h);
  if (net > Math.max(30, diag * 0.28)) return false;   /* not closed */

  var t0 = p[0][2], t1 = p[n - 1][2];

  /* 2. RECTANGLE: most points hug the bbox edges AND all four
     corners are actually approached (a circle never gets close
     to its bbox corners: the gap is ~0.41 x radius). */
  var tol = Math.max(9, Math.max(w, h) * 0.16);
  var fit = 0;
  for (i = 0; i < n; i++) {
    var dxo = Math.max(x0 - p[i][0], 0, p[i][0] - x1);
    var dyo = Math.max(y0 - p[i][1], 0, p[i][1] - y1);
    var out = Math.sqrt(dxo * dxo + dyo * dyo);
    var inDist = Math.min(p[i][0] - x0, x1 - p[i][0], p[i][1] - y0, y1 - p[i][1]);
    if ((out > 0 ? out : inDist) <= tol) fit++;
  }
  var ctol = Math.max(7, Math.min(w, h) * 0.15);
  var cg = [false, false, false, false];
  for (i = 0; i < n; i++) {
    if (dist(p[i][0], p[i][1], x0, y0) < ctol) cg[0] = true;
    if (dist(p[i][0], p[i][1], x1, y0) < ctol) cg[1] = true;
    if (dist(p[i][0], p[i][1], x1, y1) < ctol) cg[2] = true;
    if (dist(p[i][0], p[i][1], x0, y1) < ctol) cg[3] = true;
  }
  if (fit / n > 0.82 && cg[0] && cg[1] && cg[2] && cg[3]) {
    var steps = 5;
    var corners = [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]];
    var rp = [];
    for (i = 0; i < steps; i++) {
      rp.push([corners[i][0], corners[i][1], t0 + (t1 - t0) * i / (steps - 1)]);
    }
    s.pts = rp;
    return true;
  }

  /* 3. ELLIPSE (incl. circle): radial deviation from the bbox-
     inscribed ellipse is small */
  var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  var rx = w / 2, ry = h / 2, rmax = Math.max(rx, ry);
  var dev = 0;
  for (i = 0; i < n; i++) {
    var px = p[i][0] - cx, py = p[i][1] - cy;
    var t = Math.atan2(py, px);
    var er = Math.sqrt((rx * Math.cos(t)) * (rx * Math.cos(t)) + (ry * Math.sin(t)) * (ry * Math.sin(t)));
    var r = Math.sqrt(px * px + py * py);
    dev += Math.abs(r - er);
  }
  if (dev / n / rmax < 0.14) {
    var steps2 = 28;
    var ep = [];
    for (i = 0; i < steps2; i++) {
      var a = (i / (steps2 - 1)) * Math.PI * 2;
      ep.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a), t0 + (t1 - t0) * i / (steps2 - 1)]);
    }
    s.pts = ep;
    return true;
  }

  return false;
}

/* ============================================================
 * TEXT TOOL (Samsung insert-text)
 * ============================================================ */
function openTextEditor(docX, docY) {
  var n = activeNote();
  if (!n) return;
  closePanels();

  /* tap on an existing text object = edit it */
  var target = null;
  for (var i = n.strokes.length - 1; i >= 0; i--) {
    var s = n.strokes[i];
    if (s.pen !== PEN_TEXT) continue;
    var bb = strokeBBox(s);
    if (docX >= bb.x0 - 8 && docX <= bb.x1 + 8 && docY >= bb.y0 - 8 && docY <= bb.y1 + 8) {
      target = s;
      break;
    }
  }

  if (target) {
    textEdit = { mode: 'edit', x: target.pts[0][0], y: target.pts[0][1], s: target };
    textAreaEl.value = target.txt || '';
  } else {
    textEdit = { mode: 'new', x: docX, y: docY, s: null };
    textAreaEl.value = '';
  }

  var sz = textStrokeSize();
  textAreaEl.style.fontSize = Math.round(Math.min(Math.max(sz * zoom, 12), 34)) + 'px';
  textAreaEl.style.color = settings.color;

  var sp = docToScreen(textEdit.x, textEdit.y);
  var left = sp.x - 30;
  if (left < 12) left = 12;
  if (left > viewW - 296) left = viewW - 296;
  var top = sp.y - 40;
  if (top < 62) top = 62;
  if (top > viewH * 0.32) top = Math.round(viewH * 0.32);   /* stay above the keyboard */
  textOverlayEl.style.left = left + 'px';
  textOverlayEl.style.top = top + 'px';
  textOverlayEl.style.display = 'block';

  if (textFocusTimer) clearTimeout(textFocusTimer);
  textFocusTimer = setTimeout(function () {
    textFocusTimer = null;
    if (textEdit && typeof textAreaEl.focus === 'function') textAreaEl.focus();
  }, 80);
}

function textStrokeSize() {
  /* text size follows the pen thickness slider (18..33 px) */
  return 18 + settings.widthStep * 3;
}

function closeTextEditor() {
  if (textFocusTimer) { clearTimeout(textFocusTimer); textFocusTimer = null; }
  textEdit = null;
  if (typeof textAreaEl.blur === 'function') textAreaEl.blur();
  textOverlayEl.style.display = 'none';
}

function commitText() {
  if (!textEdit) return;
  var n = activeNote();
  if (!n) { closeTextEditor(); return; }
  var val = textAreaEl.value;
  if (val && val.replace(/\s/g, '').length === 0) val = '';

  if (textEdit.mode === 'new') {
    if (val) {
      var s = mkTextStroke(textEdit.x, textEdit.y, textStrokeSize(), settings.color, val);
      addStroke(n, s);
      pushUndo({ t: 'add', s: s });
      recomputeDoc();
      saveSoon();
      requestRender();
    }
  } else {
    var s2 = textEdit.s;
    if (!s2) { closeTextEditor(); return; }
    if (!val) {
      /* emptied the box: remove the text object */
      var old = { t: 'erase', list: [s2] };
      removeStroke(n, s2);
      pushUndo(old);
      recomputeDoc();
    } else if (s2.txt !== val) {
      var op = { t: 'textedit', s: s2, oldTxt: s2.txt, oldTw: s2.tw, oldTh: s2.th,
                 newTxt: val, newTw: 0, newTh: 0 };
      var bb = strokeBBox(s2);
      invalidateRange(bb.y0, bb.y1);
      s2.txt = val;
      measureTextStroke(s2);
      op.newTw = s2.tw; op.newTh = s2.th;
      s2.bb = null;
      var bb2 = strokeBBox(s2);
      invalidateRange(bb2.y0, bb2.y1);
      pushUndo(op);
      recomputeDoc();
    }
    saveSoon();
    requestRender();
  }
  closeTextEditor();
}

/* ---------- scroll position pill ---------- */
function updateScrollPill() {
  var totalPages = Math.max(1, Math.ceil(docH / (PAGE_H + GAP_H)));
  var page = Math.floor((scrollY + viewH / zoom / 2) / (PAGE_H + GAP_H)) + 1;
  if (page > totalPages) page = totalPages;
  if (page < 1) page = 1;
  var txt = page + ' / ' + totalPages;
  if (Math.abs(zoom - 1) > 0.01) txt = txt + '  ' + Math.round(zoom * 100) + '%';
  scrollPill.textContent = txt;
  scrollPill.style.display = 'block';
  if (scrollPillTimer) clearTimeout(scrollPillTimer);
  /* while zoomed the pill stays visible as the zoom indicator */
  if (Math.abs(zoom - 1) <= 0.01) {
    scrollPillTimer = setTimeout(function () { scrollPill.style.display = 'none'; }, 1300);
  }
}
function resetZoom() {
  zoom = 1;
  scrollX = 0;
  clampScroll();
  requestRender();
  updateScrollPill();
  if (scrollPillTimer) { clearTimeout(scrollPillTimer); scrollPillTimer = null; }
  scrollPillTimer = setTimeout(function () { scrollPill.style.display = 'none'; }, 1300);
  toast('Zoom 100%');
}

/* ---------- reset (note switch) ---------- */
function resetTouchTracking() {
  touchStates = {};
  inkNow = {};
  gesture = null;
  momentum = null;
  palmMem = [];
  lastBounce = null;
  lastInkPt = null;
  pinchTrack = null;
  eraserTouchId = null;
  lassoId = null;
  selDrag = null;
  selScale = null;
  lastHandTap = null;
  if (dotQueue) { clearTimeout(dotQueue.timer); dotQueue = null; }
  hidePendingDot();
  clearSelection();
  closeTextEditor();
}

/* ============================================================
 * FLIGHT RECORDER + GITHUB UPLOAD
 *
 * Palm rejection and gesture detection cannot be tuned from a
 * desk: the thresholds depend on this digitizer, this stylus and
 * this hand. And the failures are intermittent - "sometimes it
 * zooms and jitters", "sometimes the palm writes" - so asking the
 * user to start a recording and then reproduce the bug does not
 * work. You cannot predict when it will happen.
 *
 * So the recorder is always on, writing into a fixed-size ring
 * that holds roughly the last minute of input. When something
 * goes wrong the user taps Copy report and the last ~25 seconds
 * of input comes out as text.
 *
 * The ring is a preallocated array with a write index, not a
 * push/shift queue: shift() on a large array 60 times a
 * second is real work on a 2012 A5X.
 *
 * Records (all timestamps are ms since the app started):
 *   [0..3, id, x, y, t, rx]   touch down / move / up / cancel
 *   ['v',  id, verdict, t]    what the palm engine decided
 *   ['g',  what, a, b, t]     gesture engage / end / momentum
 *   ['z',  zoom, sx, sy, t]   view changed (zoom or pan)
 * ============================================================ */

/* ---------- 0.1 what does this digitizer ACTUALLY report? ----------
 * Every threshold in this engine exists because we believed the
 * hardware reports no contact size and no pressure. That belief came
 * from reading touch.radiusX alone. Safari has historically exposed
 * vendor-prefixed twins of those fields, and they were never checked.
 * If any of them carries a real value on this device, palm rejection
 * stops being behavioural guesswork: a palm is a big contact and a
 * disc stylus is a small one.
 *
 * So observe every candidate on every real touch and keep the maximum.
 *   null  -> the property does not exist on this device
 *   0     -> it exists but has only ever been zero (useless)
 *   > 0   -> a real signal, and everything below it can be rebuilt */
var CAP_KEYS = [
  'radiusX', 'radiusY', 'webkitRadiusX', 'webkitRadiusY',
  'force', 'webkitForce', 'rotationAngle', 'webkitRotationAngle',
  'altitudeAngle', 'azimuthAngle', 'touchType', 'size', 'pressure'
];
var capMax = null;

function capObserve(touch) {
  /* real touches only - the desktop mouse path fakes a Touch and would
     poison the result with absent properties */
  if (typeof touch.identifier !== 'number') return;
  var i, k, v;
  if (!capMax) {
    capMax = {};
    for (i = 0; i < CAP_KEYS.length; i++) {
      k = CAP_KEYS[i];
      capMax[k] = (typeof touch[k] === 'undefined') ? null : 0;
    }
  }
  for (i = 0; i < CAP_KEYS.length; i++) {
    k = CAP_KEYS[i];
    if (capMax[k] === null) continue;
    v = touch[k];
    if (typeof v === 'number' && v > capMax[k]) capMax[k] = v;
  }
}

function capsReport() {
  if (!capMax) return 'No touches seen yet - draw something first.';
  var lines = [], k, v, live = 0;
  for (k in capMax) {
    if (!capMax.hasOwnProperty(k)) continue;
    v = capMax[k];
    if (v === null) lines.push(k + ': absent');
    else if (v === 0) lines.push(k + ': always 0');
    else { lines.push(k + ': UP TO ' + v + '  <-- REAL SIGNAL'); live++; }
  }
  var NL = String.fromCharCode(10);
  return (live
    ? live + ' usable signal(s) found. This changes everything - send a report.'
    : 'No contact size or pressure on this device. Behaviour is all we have.')
    + NL + NL + lines.join(NL);
}

var TRACE_MAX = 2000;   /* ~20-30s; a copy/paste report must stay pasteable */
var traceBuf = new Array(TRACE_MAX);
var traceHead = 0;         /* next slot to write */
var traceCount = 0;        /* valid entries, capped at TRACE_MAX */
var traceT0 = 0;
var traceOn = true;        /* always recording unless turned off */
var traceLastZoom = -1;
var traceSending = false;

function traceNow(now) {
  if (!traceT0) traceT0 = now;
  return now - traceT0;
}

function tracePush(rec) {
  traceBuf[traceHead] = rec;
  traceHead = (traceHead + 1) % TRACE_MAX;
  if (traceCount < TRACE_MAX) traceCount++;
}

/* p = phase: 0 down, 1 move, 2 up, 3 cancel */
function traceTouch(p, touch, now) {
  capObserve(touch);
  if (!traceOn) return;
  tracePush([p, touch.identifier,
             Math.round(touch.clientX * 10) / 10,
             Math.round(touch.clientY * 10) / 10,
             traceNow(now),
             touch.radiusX || 0]);
}

/* v = 'ink' | 'palm' | 'dot' | 'usurped' | 'discarded' | 'undo' */
function traceVerdict(v, id, now) {
  if (!traceOn) return;
  tracePush(['v', id, v, traceNow(now)]);
}

/* gesture engine events - the zoom/jitter complaints live here */
function traceGesture(what, a, b, now) {
  if (!traceOn) return;
  tracePush(['g', what, a, b, traceNow(now)]);
}

/* view changes, throttled to meaningful movement */
function traceView(now) {
  if (!traceOn) return;
  if (Math.abs(zoom - traceLastZoom) < 0.01) return;
  traceLastZoom = zoom;
  tracePush(['z', Math.round(zoom * 1000) / 1000,
             Math.round(scrollX), Math.round(scrollY), traceNow(now)]);
}

/* read the ring back in chronological order */
function traceSamples() {
  var out = [], i, idx;
  var start = (traceHead - traceCount + TRACE_MAX) % TRACE_MAX;
  for (i = 0; i < traceCount; i++) {
    idx = (start + i) % TRACE_MAX;
    if (traceBuf[idx]) out.push(traceBuf[idx]);
  }
  return out;
}

function buildTrace(label) {
  return {
    v: 2,
    label: label || '',
    ua: navigator.userAgent,
    viewW: viewW, viewH: viewH,
    wrapLeft: wrapRect.left, wrapTop: wrapRect.top,
    dpr: dpr, zoom: zoom,
    scrollX: Math.round(scrollX), scrollY: Math.round(scrollY),
    palmLevel: settings.palmLevel, hand: settings.hand,
    caps: capMax,
    tool: tool, spacing: settings.spacing,
    at: new Date().toISOString(),
    samples: traceSamples()
  };
}

/* ---------- copy the report out ----------
 * Uploading straight to GitHub did not work from a 2012 TLS stack,
 * so the report is shown as text to select and paste. */
function showTrace() {
  var txt;
  try { txt = JSON.stringify(buildTrace('report')); }
  catch (e) { toast('Could not build the report'); return; }
  traceText.value = txt;
  traceOverlay.className = 'overlay on';
  /* pre-select so it is one Copy tap */
  try { traceText.focus(); traceText.setSelectionRange(0, txt.length); } catch (e) {}
}

/* tooling hook: scripts/replay.js and the test harness read the
   trace from here. */
window.__mnTrace = function () { return buildTrace('readback'); };

/* ---------- event wiring ---------- */
function onTouchStart(e) {
  e.preventDefault();
  closePanels();
  stopMomentum();
  var now = Date.now();
  var ch = e.changedTouches;
  var burst = ch.length >= 2 || (e.touches && e.touches.length >= 3);
  if (burst) traceGesture('burst', ch.length, e.touches ? e.touches.length : 0, now);
  for (var i = 0; i < ch.length; i++) { traceTouch(0, ch[i], now); beginTouch(ch[i], now, burst); }
}
function onTouchMove(e) {
  e.preventDefault();
  var now = Date.now();
  var ch = e.changedTouches;
  for (var i = 0; i < ch.length; i++) { traceTouch(1, ch[i], now); moveTouch(ch[i], now); }
  rigidGroupCheck(now);
  detectGesture(now);
  applyGesture(now);
}
function onTouchEnd(e) {
  e.preventDefault();
  var now = Date.now();
  var cancelled = (e.type === 'touchcancel');
  var ch = e.changedTouches;
  for (var i = 0; i < ch.length; i++) { traceTouch(cancelled ? 3 : 2, ch[i], now); endTouch(ch[i], now, cancelled); }
}

canvasWrap.addEventListener('touchstart', onTouchStart, false);
canvasWrap.addEventListener('touchmove', onTouchMove, false);
canvasWrap.addEventListener('touchend', onTouchEnd, false);
canvasWrap.addEventListener('touchcancel', onTouchEnd, false);
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

/* mouse support for desktop testing (no palm rejection) */
var mouseId = 'mouse';
canvasWrap.addEventListener('mousedown', function (e) {
  e.preventDefault();
  stopMomentum();
  var now = Date.now();
  var touch = { identifier: mouseId, clientX: e.clientX, clientY: e.clientY, radiusX: 0 };
  traceTouch(0, touch, now);
  beginTouch(touch, now);
});
canvasWrap.addEventListener('mousemove', function (e) {
  if (!touchStates[mouseId]) return;
  var now = Date.now();
  var mt = { identifier: mouseId, clientX: e.clientX, clientY: e.clientY, radiusX: 0 };
  traceTouch(1, mt, now);
  moveTouch(mt, now);
  /* mouse input must run the same gesture pipeline as touches,
     otherwise the hand tool cannot pan with a mouse */
  detectGesture(now);
  applyGesture(now);
});
window.addEventListener('mouseup', function (e) {
  if (!touchStates[mouseId]) return;
  var now = Date.now();
  var mu = { identifier: mouseId, clientX: e.clientX, clientY: e.clientY, radiusX: 0 };
  traceTouch(2, mu, now);
  endTouch(mu, now, false);
});

/* flush saves when the tab leaves */
window.addEventListener('pagehide', doSaveNow);
window.addEventListener('beforeunload', doSaveNow);
window.addEventListener('resize', function () { resizeView(); });
window.addEventListener('orientationchange', function () { setTimeout(resizeView, 350); });

/* ============================================================
 * UI WIRING: home, drawer, toolbar, palette, menus, init
 * ============================================================ */

function showView(which) {
  if (which === 'home') {
    homeView.className = 'view on';
    drawView.className = 'view';
  } else {
    homeView.className = 'view';
    drawView.className = 'view on';
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------- home (search + favorites + cards) ---------- */
function renderHome(filterText) {
  var nb = notebooks[curNotebook];
  homeTitle.textContent = nb ? nb.title : 'Notes';
  notesGrid.innerHTML = '';
  var q = (filterText === undefined ? searchInputEl.value : filterText);
  q = String(q || '').toLowerCase();
  var ids = nb ? nb.notes : [];
  var shown = [], i;
  for (i = 0; i < ids.length; i++) {
    var nt = notes[ids[i]];
    if (!nt) continue;
    if (q && (nt.title || 'Untitled').toLowerCase().indexOf(q) < 0) continue;
    shown.push(ids[i]);
  }
  /* favorites first, then most recently modified */
  shown.sort(function (a, b) {
    var na = notes[a], nbv = notes[b];
    var fa = na && na.fav ? 1 : 0, fb = nbv && nbv.fav ? 1 : 0;
    if (fa !== fb) return fb - fa;
    return (nbv && nbv.mod || 0) - (na && na.mod || 0);
  });
  var j = 0;
  for (i = 0; i < shown.length; i++) {
    var n = notes[shown[i]];
    var card = document.createElement('div');
    card.className = 'note-card';

    var titleEl = document.createElement('div');
    titleEl.className = 'nc-title';
    titleEl.textContent = n.title || 'Untitled';
    card.appendChild(titleEl);

    var subEl = document.createElement('div');
    subEl.className = 'nc-sub';
    subEl.textContent = n.strokes.length + ' strokes';
    card.appendChild(subEl);

    var dateEl = document.createElement('div');
    dateEl.className = 'nc-date';
    dateEl.textContent = (n.mod ? fmtDate(n.mod) : fmtDate(n.cr));
    card.appendChild(dateEl);

    var star = document.createElement('button');
    star.className = 'star-btn' + (n.fav ? ' on' : '');
    star.innerHTML =
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">' +
      '<path d="M12 3.6 l2.6 5.4 5.9 0.8 -4.3 4.1 1 5.8 -5.2 -2.8 -5.2 2.8 1 -5.8 -4.3 -4.1 5.9 -0.8 z"/></svg>';
    (function (note, starEl) {
      starEl.addEventListener('click', function (ev) {
        if (ev && typeof ev.stopPropagation === 'function') ev.stopPropagation();
        note.fav = !note.fav;
        saveSoon();
        renderHome();
      });
    })(n, star);
    card.appendChild(star);

    (function (id) {
      card.addEventListener('click', function () { openNote(id); });
    })(shown[i]);
    notesGrid.appendChild(card);
    j++;
  }
  emptyHint.style.display = j ? 'none' : 'block';
}

function openNote(id) {
  var n = notes[id];
  if (!n) return;
  curNoteId = id;
  undoStack = [];
  redoStack = [];
  resetTouchTracking();
  invalidateAll();
  scrollY = n.scroll || 0;
  scrollX = 0;
  zoom = 1;
  noteTitleBtn.textContent = n.title || 'Untitled';
  updateUndoButtons();
  recomputeDoc();
  clampScroll();
  showView('draw');
  resizeView();
  applyPalmUI();
  saveSoon();
}

function goHome() {
  var n = activeNote();
  if (n) { n.scroll = Math.round(scrollY); n.mod = Date.now(); }
  doSaveNow();
  closePanels();
  closeTextEditor();
  clearSelection();
  showView('home');
  renderHome();
}

function newNote() {
  var id = genId();
  notes[id] = { id: id, title: 'Untitled', cr: Date.now(), mod: Date.now(), scroll: 0, strokes: [] };
  if (notebooks[curNotebook]) notebooks[curNotebook].notes.unshift(id);
  openNote(id);
  toast('New note created');
}

function renameCurrentNote() {
  var n = activeNote();
  if (!n) return;
  var name = window.prompt('Note name', n.title || 'Untitled');
  if (name !== null && name !== '') {
    n.title = name;
    n.mod = Date.now();
    noteTitleBtn.textContent = n.title;
    saveSoon();
  }
}

function deleteCurrentNote() {
  var n = activeNote();
  if (!n) return;
  closePanels();
  if (!window.confirm('Delete this note permanently?')) return;
  var nb = notebooks[curNotebook];
  var idx = nb ? nb.notes.indexOf(n.id) : -1;
  if (idx >= 0) nb.notes.splice(idx, 1);
  delete notes[n.id];
  doSaveNow();
  showView('home');
  renderHome();
  toast('Note deleted');
}

function clearNote() {
  var n = activeNote();
  if (!n) return;
  closePanels();
  if (!n.strokes.length) return;
  if (!window.confirm('Clear all writing on this note?')) return;
  var old = n.strokes;
  n.strokes = [];
  pushUndo({ t: 'erase', list: old });
  invalidateAll();
  recomputeDoc();
  saveSoon();
  requestRender();
  toast('Note cleared (undo available)');
}

/* ---------- drawer ---------- */
function renderDrawer() {
  nbList.innerHTML = '';
  for (var i = 0; i < notebooks.length; i++) {
    var nb = notebooks[i];
    var row = document.createElement('button');
    row.className = 'nb-row';
    row.innerHTML =
      '<span class="dot" style="background:' + nb.color + '"></span>' +
      '<span class="nm">' + escapeHtml(nb.title) + '</span>' +
      '<span class="ct">' + nb.notes.length + '</span>';
    (function (idx) {
      row.addEventListener('click', function () {
        curNotebook = idx;
        closeDrawer();
        renderHome();
        saveSoon();
      });
    })(i);
    nbList.appendChild(row);
  }
}
function openDrawer() { renderDrawer(); drawer.className = 'open'; drawerBackdrop.style.display = 'block'; }
function closeDrawer() { drawer.className = ''; drawerBackdrop.style.display = 'none'; }

/* ---------- pen palette ---------- */
function drawSquiggle(canvasEl, pen, w, color) {
  var c = canvasEl.getContext('2d');
  if (!c) return;
  var W = canvasEl.width / 2, H = canvasEl.height / 2;
  c.setTransform(2, 0, 0, 2, 0, 0);
  c.clearRect(0, 0, W, H);
  var pts = [], t = 0;
  for (var i = 0; i <= 26; i++) {
    var x = 7 + (W - 14) * i / 26;
    var y = H / 2 + Math.sin(i / 26 * Math.PI * 2) * (H / 2 - 7);
    t += 6 + 42 * Math.abs(Math.sin(i / 26 * Math.PI));
    pts.push([x, y, t]);
  }
  var s = mkStroke(pen, w, color, pts);
  renderStrokeFull(c, s);
}

function buildPalette() {
  penChips.innerHTML = '';
  for (var i = 0; i < PENS.length; i++) {
    var chip = document.createElement('button');
    chip.className = 'pen-chip';
    var mini = document.createElement('canvas');
    mini.width = 88; mini.height = 52;
    mini.style.width = '44px';
    mini.style.height = '26px';
    chip.appendChild(mini);
    var nm = document.createElement('div');
    nm.className = 'pn';
    nm.textContent = PENS[i].name;
    chip.appendChild(nm);
    chip.setAttribute('data-pen', i);
    (function (idx, el) {
      el.addEventListener('click', function () {
        /* per-pen memory: store the outgoing pen's settings, load
           the incoming pen's remembered color + size */
        settings.penCfg[settings.pen].c = settings.color;
        settings.penCfg[settings.pen].w = settings.widthStep;
        settings.pen = idx;
        var cfg = settings.penCfg[idx];
        settings.color = cfg.c;
        settings.widthStep = cfg.w;
        applyPenUI();
        saveSoon();
      });
    })(i, chip);
    penChips.appendChild(chip);
  }
  colorRow.innerHTML = '';
  for (var k = 0; k < COLORS.length; k++) {
    var sw = document.createElement('button');
    sw.className = 'sw';
    sw.style.background = COLORS[k];
    sw.setAttribute('data-color', COLORS[k]);
    (function (col, el) {
      el.addEventListener('click', function () {
        settings.color = col;
        settings.penCfg[settings.pen].c = col;
        applyPenUI();
        saveSoon();
      });
    })(COLORS[k], sw);
    colorRow.appendChild(sw);
  }
  previewCanvas.style.width = '268px';
  previewCanvas.style.height = '44px';
  thicknessRange.addEventListener('change', function () {
    settings.widthStep = lim(parseInt(thicknessRange.value, 10) || 0, 0, 5);
    settings.penCfg[settings.pen].w = settings.widthStep;
    applyPenUI();
    saveSoon();
  });
  shapeOffBtn.addEventListener('click', function () { settings.shapeAssist = SHAPE_OFF; applyShapeUI(); saveSoon(); });
  shapeLineBtn.addEventListener('click', function () { settings.shapeAssist = SHAPE_LINE; applyShapeUI(); saveSoon(); });
  shapeShapeBtn.addEventListener('click', function () { settings.shapeAssist = SHAPE_SHAPE; applyShapeUI(); saveSoon(); });
}

function applyPenUI() {
  /* keep the active pen's cfg in sync (migration + safety) */
  if (settings.penCfg[settings.pen]) {
    settings.penCfg[settings.pen].c = settings.color;
    settings.penCfg[settings.pen].w = settings.widthStep;
  }
  var chips = penChips.children;
  for (var i = 0; i < chips.length; i++) {
    chips[i].className = 'pen-chip' + (i === settings.pen ? ' on' : '');
    var mini = chips[i].getElementsByTagName('canvas')[0];
    if (mini) drawSquiggle(mini, i, 3, i === settings.pen ? settings.color : '#8A9098');
  }
  var sws = colorRow.children;
  for (var k = 0; k < sws.length; k++) {
    sws[k].className = 'sw' + (sws[k].getAttribute('data-color') === settings.color ? ' on' : '');
  }
  penBadge.style.background = settings.color;
  thicknessRange.value = String(settings.widthStep);
  drawSquiggle(previewCanvas, settings.pen, currentPenWidth(), settings.color);
  applyShapeUI();
}

function applyShapeUI() {
  shapeOffBtn.className = 'sh-mode first' + (settings.shapeAssist === SHAPE_OFF ? ' on' : '');
  shapeLineBtn.className = 'sh-mode mid' + (settings.shapeAssist === SHAPE_LINE ? ' on' : '');
  shapeShapeBtn.className = 'sh-mode last' + (settings.shapeAssist === SHAPE_SHAPE ? ' on' : '');
}

/* ---------- eraser panel ---------- */
function buildEraserPanel() {
  var modeBtns = [byId('epStroke'), byId('epArea')];
  modeBtns[0].addEventListener('click', function () { eraserMode = 0; applyEraserUI(); });
  modeBtns[1].addEventListener('click', function () { eraserMode = 1; applyEraserUI(); });
  sizeRow.innerHTML = '';
  var dims = [14, 20, 28, 38];
  for (var i = 0; i < ERASER_SIZES.length; i++) {
    var b = document.createElement('button');
    b.className = 'ep-size';
    b.style.width = dims[i] + 'px';
    b.style.height = dims[i] + 'px';
    b.style.marginRight = (16 - dims[i] / 2) + 'px';
    b.setAttribute('data-size', ERASER_SIZES[i]);
    (function (sz, el) {
      el.addEventListener('click', function () { eraserSize = sz; applyEraserUI(); });
    })(ERASER_SIZES[i], b);
    sizeRow.appendChild(b);
  }
  applyEraserUI();
}

function applyEraserUI() {
  byId('epStroke').className = 'ep-mode first' + (eraserMode === 0 ? ' on' : '');
  byId('epArea').className = 'ep-mode last' + (eraserMode === 1 ? ' on' : '');
  var btns = sizeRow.children;
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = 'ep-size' + (parseInt(btns[i].getAttribute('data-size'), 10) === eraserSize ? ' on' : '');
  }
}

/* ---------- more menu ---------- */
var moreRowDefs = null;
function buildMoreMenu() {
  moreMenu.innerHTML = '';
  moreRowDefs = [
    { lbl: 'Export PNG', val: '', act: exportPNG },
    { lbl: 'Template', val: TPL_NAMES[settings.template], act: function () { settings.template = (settings.template + 1) % 4; afterSettingChange(); } },
    { lbl: 'Line spacing', val: settings.spacing + ' px', act: function () { settings.spacing = settings.spacing === 32 ? 38 : (settings.spacing === 38 ? 44 : 32); afterSettingChange(); } },
    { lbl: 'Paper color', val: (PAPERS[settings.paperColor] || PAPERS[0]).name, act: function () { settings.paperColor = (settings.paperColor + 1) % PAPERS.length; afterSettingChange(); } },
    { lbl: 'Theme', val: settings.uiDark ? 'Dark' : 'Light', act: function () {
        settings.uiDark = !settings.uiDark;
        if (settings.uiDark && settings.paperColor === 0) settings.paperColor = 4;
        else if (!settings.uiDark && settings.paperColor === 4) settings.paperColor = 0;
        applyTheme();
        afterSettingChange();
      } },
    { lbl: 'Zoom', val: Math.round(zoom * 100) + '%', act: function () { resetZoom(); } },
    { lbl: 'Palm rejection', val: PALM_NAMES[settings.palmLevel], act: function () { settings.palmLevel = nextPalmLevel(settings.palmLevel); applyPalmUI(); afterSettingChange(); } },
    { lbl: 'Writing hand', val: HAND_NAMES[settings.hand], act: function () { settings.hand = (settings.hand + 1) % 3; afterSettingChange(); } },
    { lbl: 'Touch guide', val: settings.guideDots ? 'On' : 'Off', act: function () { settings.guideDots = !settings.guideDots; hidePendingDot(); afterSettingChange(); } },
    { lbl: 'Copy report', val: traceCount ? traceCount + ' pts' : 'empty', act: showTrace },
    { lbl: 'Touch capabilities', val: '', act: function () { window.alert(capsReport()); } },
    { lbl: 'Recording', val: traceOn ? 'On' : 'Off', act: function () { traceOn = !traceOn; afterSettingChange(); } },
    { lbl: 'Clear note', val: '', warn: true, act: clearNote },
    { lbl: 'Delete note', val: '', warn: true, act: deleteCurrentNote },
    { lbl: 'About', val: '', act: function () { window.alert('MathNotes v5.1 (S-Class 5)\n\nSamsung-notes style handwriting for iPad 3.\nWorks offline. Notes are saved in this browser.\n\nHand tool: finger scrolls, pen writes.\nTwo-finger pinch zooms. Lasso tool selects ink.\nDrag the corner handle or tap - / + to resize\nthe selection. Double-tap with the hand tool\nresets zoom.'); } }
  ];
  for (var i = 0; i < moreRowDefs.length; i++) {
    var d = moreRowDefs[i];
    var row = document.createElement('button');
    row.className = 'mrow' + (d.warn ? ' warn' : '');
    row.innerHTML = '<span class="lbl">' + d.lbl + '</span>' + (d.val ? '<span class="val">' + d.val + '</span>' : '');
    (function (def) {
      row.addEventListener('click', function () {
        if (moreMenu.style.display === 'block') moreMenu.style.display = 'none';
        def.act();
      });
    })(d);
    moreMenu.appendChild(row);
  }
}
function afterSettingChange() {
  buildMoreMenu();
  requestRender();
  saveSoon();
}

/* ---------- dark theme ---------- */
function applyTheme() {
  document.body.className = settings.uiDark ? 'dark' : '';
}

/* ---------- palm level ---------- */
function applyPalmUI() {
  palmBtn.textContent = 'Palm: ' + PALM_NAMES[settings.palmLevel];
  palmBtn.className = settings.palmLevel >= PALM_MAX ? 'maxed' : '';
}
function nextPalmLevel(l) {
  if (l === PALM_OFF) return PALM_MAX;
  if (l === PALM_MAX) return PALM_STRICT;
  return PALM_OFF;
}

function cyclePalm() {
  settings.palmLevel = nextPalmLevel(settings.palmLevel);
  applyPalmUI();
  toast('Palm rejection: ' + PALM_NAMES[settings.palmLevel]);
  saveSoon();
}

/* ---------- panels ---------- */
function closePanels() {
  penPalette.style.display = 'none';
  eraserPanel.style.display = 'none';
  moreMenu.style.display = 'none';
}

/* ---------- button wiring ---------- */
byId('menuBtn').addEventListener('click', openDrawer);
byId('drawerCloseBtn').addEventListener('click', closeDrawer);
drawerBackdrop.addEventListener('click', closeDrawer);
byId('newNbBtn').addEventListener('click', function () {
  var name = window.prompt('Notebook name', 'New notebook');
  if (name !== null && name !== '') {
    notebooks.push({ id: genId(), title: name, color: NB_COLORS[notebooks.length % NB_COLORS.length], notes: [] });
    curNotebook = notebooks.length - 1;
    closeDrawer();
    renderHome();
    saveSoon();
  }
});
byId('nbRenameBtn').addEventListener('click', function () {
  var nb = notebooks[curNotebook];
  if (!nb) return;
  var name = window.prompt('Notebook name', nb.title);
  if (name !== null && name !== '') {
    nb.title = name;
    renderDrawer();
    renderHome();
    saveSoon();
  }
});
byId('fabNew').addEventListener('click', newNote);
byId('backBtn').addEventListener('click', goHome);
noteTitleBtn.addEventListener('click', renameCurrentNote);
palmBtn.addEventListener('click', cyclePalm);
byId('moreBtn').addEventListener('click', function () {
  if (moreMenu.style.display === 'block') moreMenu.style.display = 'none';
  else { buildMoreMenu(); moreMenu.style.display = 'block'; penPalette.style.display = 'none'; eraserPanel.style.display = 'none'; }
});

penBtn.addEventListener('click', function () {
  if (tool === 'pen' && penPalette.style.display === 'block') {
    penPalette.style.display = 'none';
    return;
  }
  setTool('pen');
  applyPenUI();
  penPalette.style.display = 'block';
});
selectBtn.addEventListener('click', function () { setTool('select'); });
textBtn.addEventListener('click', function () { setTool('text'); });
handBtn.addEventListener('click', function () { setTool('hand'); });
eraserBtn.addEventListener('click', function () {
  if (tool === 'eraser' && eraserPanel.style.display === 'block') {
    eraserPanel.style.display = 'none';
    return;
  }
  setTool('eraser');
  applyEraserUI();
  eraserPanel.style.display = 'block';
});

function setTool(t) {
  tool = t;
  penBtn.className = 'tb-btn' + (t === 'pen' ? ' on' : '');
  selectBtn.className = 'tb-btn' + (t === 'select' ? ' on' : '');
  textBtn.className = 'tb-btn' + (t === 'text' ? ' on' : '');
  eraserBtn.className = 'tb-btn' + (t === 'eraser' ? ' on' : '');
  handBtn.className = 'tb-btn' + (t === 'hand' ? ' on' : '');
  penPalette.style.display = 'none';
  eraserPanel.style.display = 'none';
  /* an abandoned lasso must not linger */
  if (lassoId !== null) {
    var ls = touchStates[lassoId];
    if (ls) { delete touchStates[lassoId]; lassoId = null; }
  }
}

/* selection action bar */
selDelBtn.addEventListener('click', deleteSelection);
selCopyBtn.addEventListener('click', duplicateSelection);
selSmallBtn.addEventListener('click', function () { scaleSelectionBy(0.85); });
selBigBtn.addEventListener('click', function () { scaleSelectionBy(1.18); });
selDoneBtn.addEventListener('click', function () { clearSelection(); requestRender(); });

/* text editor */
textDoneBtn.addEventListener('click', commitText);
textCancelBtn.addEventListener('click', closeTextEditor);

/* page jump: tap the scroll/zoom pill */
scrollPill.addEventListener('click', function () {
  if (homeView.className.indexOf('on') >= 0) return;
  var totalPages = Math.max(1, Math.ceil(docH / (PAGE_H + GAP_H)));
  var cur = Math.floor((scrollY + viewH / zoom / 2) / (PAGE_H + GAP_H)) + 1;
  var ans = window.prompt('Go to page (1-' + totalPages + ')', String(cur));
  if (ans === null || ans === '') return;
  var p = parseInt(ans, 10);
  if (isNaN(p)) return;
  p = lim(p, 1, totalPages);
  scrollY = (p - 1) * (PAGE_H + GAP_H);
  clampScroll();
  requestRender();
  updateScrollPill();
});

/* search */
searchBtn.addEventListener('click', function () {
  if (searchBarEl.style.display === 'block') { hideSearch(); return; }
  searchBarEl.style.display = 'block';
  setTimeout(function () {
    if (searchBarEl.style.display === 'block' && typeof searchInputEl.focus === 'function') searchInputEl.focus();
  }, 60);
});
function hideSearch() {
  searchBarEl.style.display = 'none';
  searchInputEl.value = '';
  renderHome('');
}
searchCancelBtn.addEventListener('click', hideSearch);
searchInputEl.addEventListener('input', function () { renderHome(); });
undoBtn.addEventListener('click', doUndo);
redoBtn.addEventListener('click', doRedo);
byId('exportCloseBtn').addEventListener('click', function () { exportOverlay.className = 'overlay'; });
byId('traceCloseBtn').addEventListener('click', function () { traceOverlay.className = 'overlay'; });

/* drawing on the canvas closes floating panels (closePanels is
   called from onTouchStart in the input engine) */

/* ---------- boot ---------- */
function init() {
  loadAll();
  buildPalette();
  buildEraserPanel();
  buildMoreMenu();
  applyPenUI();
  applyPalmUI();
  applyTheme();
  updateUndoButtons();
  if (!storageOk) showWarning('Private Browsing detected: notes will NOT be saved after reload.');
  if (curNoteId && notes[curNoteId]) openNote(curNoteId);
  else { showView('home'); renderHome(); }
  resizeView();
}

init();

})();
</script>
</body>
</html>
