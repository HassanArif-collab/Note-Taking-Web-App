<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MathNotes">
  <meta name="format-detection" content="telephone=no">
  <title>MathNotes</title>
  <style>
    /* ============================================================
       CSS — Safari 9 / iOS 9.3.5 compatible
       No CSS Grid, no custom properties, no calc(), no var().
       Standard flexbox is OK on Safari 9.
       ============================================================ */
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      background: #ffffff;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      background: #ffffff;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      touch-action: none;          /* tells browser we handle all gestures — Safari 9 OK */
    }
    #warning {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      padding: 8px 12px;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffe69c;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.35;
      z-index: 50;
      display: none;
      -webkit-box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    #toolbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #2c2c2e;
      color: #ffffff;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: horizontal;
      -webkit-box-direction: normal;
      -webkit-flex-direction: row;
      flex-direction: row;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: start;
      -webkit-justify-content: flex-start;
      justify-content: flex-start;
      padding: 0 6px;
      z-index: 20;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }
    .btn {
      -webkit-appearance: none;
      appearance: none;
      background: #3a3a3c;
      color: #ffffff;
      border: 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 10px;
      margin: 0 3px;
      min-width: 44px;
      min-height: 40px;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(255,255,255,0.08);
      -webkit-flex: 0 0 auto;
      flex: 0 0 auto;
    }
    .btn.active {
      background: #0a84ff;
      color: #ffffff;
    }
    .tool-btn { font-weight: 700; }
    .color-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.25);
      min-width: 36px;
      min-height: 36px;
    }
    .color-btn.active {
      border: 2px solid #ffffff;
      -webkit-box-shadow: 0 0 0 2px #0a84ff;
      box-shadow: 0 0 0 2px #0a84ff;
    }
    .width-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 14px;
      font-weight: 700;
      min-width: 36px;
      min-height: 36px;
    }
    .divider {
      width: 1px;
      height: 28px;
      background: rgba(255,255,255,0.2);
      margin: 0 4px;
      -webkit-flex: 0 0 auto;
      flex: 0 0 auto;
    }
    #pageInd {
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      min-width: 54px;
      text-align: center;
      margin: 0 4px;
      -webkit-flex: 0 0 auto;
      flex: 0 0 auto;
    }
    #exportOverlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      display: none;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      padding: 16px;
    }
    .export-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      max-width: 92%;
      max-height: 92%;
      text-align: center;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .export-box p {
      font-size: 14px;
      color: #333333;
      margin: 0 0 12px 0;
      line-height: 1.45;
    }
    #exportImg {
      max-width: 100%;
      max-height: 56vh;
      border: 1px solid #cccccc;
      display: block;
      margin: 0 auto 14px auto;
      -webkit-touch-callout: default;  /* CRITICAL: allows long-press Save Image */
    }
    #exportClose {
      background: #0a84ff;
      color: #ffffff;
      border: 0;
      border-radius: 8px;
      padding: 11px 22px;
      font-size: 15px;
      font-weight: 600;
      min-width: 110px;
      min-height: 44px;
    }
  </style>
</head>
<body>
  <div id="warning"></div>
  <canvas id="canvas"></canvas>

  <div id="toolbar">
    <button id="penTool" class="btn tool-btn active">Pen</button>
    <button id="eraserTool" class="btn tool-btn">Erase</button>
    <span class="divider"></span>
    <button class="btn color-btn active" data-color="#000000" style="background:#000000"></button>
    <button class="btn color-btn" data-color="#0a66cc" style="background:#0a66cc"></button>
    <button class="btn color-btn" data-color="#cc0000" style="background:#cc0000"></button>
    <span class="divider"></span>
    <button class="btn width-btn" data-width="2">S</button>
    <button class="btn width-btn active" data-width="4">M</button>
    <button class="btn width-btn" data-width="7">L</button>
    <span class="divider"></span>
    <button id="undoBtn" class="btn">Undo</button>
    <button id="clearBtn" class="btn">Clear</button>
    <span class="divider"></span>
    <button id="prevBtn" class="btn">&#9664;</button>
    <span id="pageInd">1 / 50</span>
    <button id="nextBtn" class="btn">&#9654;</button>
    <span class="divider"></span>
    <button id="exportBtn" class="btn">PNG</button>
  </div>

  <div id="exportOverlay">
    <div class="export-box">
      <p>Press and hold the image below, then tap <b>Save Image</b> to save it to your Photos.</p>
      <img id="exportImg" alt="Exported page">
      <button id="exportClose">Close</button>
    </div>
  </div>

  <script>
  /* ================================================================
     MATHNOTES v1 — single-file ES5 app for Safari 9 / iOS 9.3.5
     ================================================================
     ARCHITECTURE
       Section A: DRAWING ENGINE  (touch/mouse, stroke model, storage,
                                   rendering, undo, pages, export)
       Section B: TOOLBAR / UI    (button wiring, tool state, indicators)
     The engine has NO knowledge of button markup. A v2 reskin can
     replace Section B without touching Section A.
     ================================================================ */
  (function () {
    'use strict';

    /* ============================================================
       SECTION A — DRAWING ENGINE
       ============================================================ */

    var STORAGE_KEY  = 'mathnotes_v1';
    var MAX_PAGES    = 50;
    var ERASE_RADIUS = 14;     /* CSS px around the touch point */
    var MAX_UNDO     = 80;     /* undo entries kept per page in memory */

    var dpr = window.devicePixelRatio || 1;

    /* DOM refs (filled in initUI) */
    var canvas, ctx, toolbarEl, warningEl;
    var exportOverlay, exportImg, pageIndEl;

    /* State */
    var pages = [];            /* each: { strokes: [...], undoStack: [...] } */
    var currentPage = 0;
    var currentColor = '#000000';
    var currentWidth = 4;
    var currentTool  = 'pen';  /* 'pen' | 'eraser' */
    var isDrawing    = false;
    var currentStroke = null;
    var storageOk    = true;

    /* -------- Storage layer (graceful degradation) -------------- */
    function showWarning(msg) {
      if (!warningEl) return;
      warningEl.textContent = msg;
      warningEl.style.display = 'block';
    }
    function hideWarning() {
      if (warningEl) warningEl.style.display = 'none';
    }

    function freshPages() {
      var p = [];
      for (var i = 0; i < MAX_PAGES; i++) {
        p.push({ strokes: [], undoStack: [] });
      }
      return p;
    }

    function loadFromStorage() {
      var data = null;
      if (storageOk) {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) data = JSON.parse(raw);
        } catch (e) {
          storageOk = false;
          showWarning('Could not read saved notes (' + e.message + '). Starting fresh.');
        }
      }
      if (data && data.pages && data.pages.length > 0) {
        pages = [];
        for (var i = 0; i < data.pages.length; i++) {
          pages.push({
            strokes:    (data.pages[i] && data.pages[i].strokes) ? data.pages[i].strokes : [],
            undoStack:  []
          });
        }
        while (pages.length < MAX_PAGES) pages.push({ strokes: [], undoStack: [] });
        currentPage = data.currentPage || 0;
        if (currentPage < 0) currentPage = 0;
        if (currentPage >= pages.length) currentPage = pages.length - 1;
      } else {
        pages = freshPages();
        currentPage = 0;
      }
    }

    function saveToStorage() {
      if (!storageOk) return;
      var toSave = { pages: [], currentPage: currentPage };
      for (var i = 0; i < pages.length; i++) {
        toSave.pages.push({ strokes: pages[i].strokes });
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      } catch (e) {
        storageOk = false;
        showWarning('Cannot save notes. You may be in Private Browsing mode, or storage is full. Notes will not persist after reload.');
      }
    }

    /* -------- Geometry helpers -------------------------------- */
    function distToSegment(px, py, x1, y1, x2, y2) {
      var dx = x2 - x1;
      var dy = y2 - y1;
      var len2 = dx * dx + dy * dy;
      if (len2 === 0) {
        var ex0 = px - x1, ey0 = py - y1;
        return Math.sqrt(ex0 * ex0 + ey0 * ey0);
      }
      var t = ((px - x1) * dx + (py - y1) * dy) / len2;
      if (t < 0) t = 0;
      else if (t > 1) t = 1;
      var cx = x1 + t * dx;
      var cy = y1 + t * dy;
      var ex = px - cx, ey = py - cy;
      return Math.sqrt(ex * ex + ey * ey);
    }

    function strokeHit(stroke, x, y, radius) {
      var pts = stroke.points;
      if (!pts || pts.length === 0) return false;
      if (pts.length === 1) {
        var dx = pts[0].x - x, dy = pts[0].y - y;
        return Math.sqrt(dx * dx + dy * dy) <= radius;
      }
      for (var i = 0; i < pts.length - 1; i++) {
        if (distToSegment(x, y, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y) <= radius) {
          return true;
        }
      }
      return false;
    }

    /* -------- Rendering --------------------------------------- */
    function clearCanvasPixels() {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    function renderStroke(stroke) {
      var pts = stroke.points;
      if (!pts || pts.length === 0) return;
      ctx.strokeStyle = stroke.color;
      ctx.lineWidth   = stroke.width;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      ctx.beginPath();
      if (pts.length === 1) {
        /* single-dot stroke — draw filled circle */
        ctx.fillStyle = stroke.color;
        ctx.arc(pts[0].x, pts[0].y, stroke.width / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      /* Smooth via midpoint quadratic curves */
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length - 1; i++) {
        var mx = (pts[i].x + pts[i + 1].x) / 2;
        var my = (pts[i].y + pts[i + 1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
      ctx.stroke();
    }

    function renderPage() {
      clearCanvasPixels();
      var page = pages[currentPage];
      if (page) {
        for (var i = 0; i < page.strokes.length; i++) {
          renderStroke(page.strokes[i]);
        }
      }
      if (currentStroke) renderStroke(currentStroke);
      updatePageIndicator();
    }

    function resizeCanvas() {
      if (!canvas || !ctx) return;
      var cssW = window.innerWidth;
      var cssH = window.innerHeight - toolbarEl.offsetHeight;
      if (cssH < 60) cssH = 60;
      canvas.style.width  = cssW + 'px';
      canvas.style.height = cssH + 'px';
      canvas.width  = Math.floor(cssW * dpr);
      canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderPage();
    }

    /* -------- Stroke lifecycle -------------------------------- */
    /*
     * PERF STRATEGY (v1.1): incremental drawing.
     *   - startStroke draws the initial dot directly on the canvas.
     *   - continueStroke draws ONLY the new line segment from the previous
     *     point to the new point. No clearCanvas, no redraw of existing
     *     strokes. This is O(1) per touchmove instead of O(N_strokes).
     *   - endStroke just commits the stroke to the model + storage. NO
     *     renderPage — the stroke is already on the canvas.
     *   - renderPage (full re-render) is reserved for genuinely destructive
     *     events: undo, erase, clear, page switch, resize, export.
     *
     * On a 2012 iPad (A5X), this takes drawing from ~5-10 fps to ~60 fps.
     */
    function startStroke(x, y) {
      if (currentTool === 'eraser') return;
      currentStroke = {
        color:  currentColor,
        width:  currentWidth,
        points: [{ x: x, y: y }]
      };
      /* Draw initial dot immediately so single-taps show a dot, and the
         first pixel of a stroke is visible without waiting for a move. */
      ctx.fillStyle = currentColor;
      ctx.beginPath();
      ctx.arc(x, y, currentWidth / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function continueStroke(x, y) {
      if (!isDrawing) return;
      if (currentTool === 'pen' && currentStroke) {
        var pts = currentStroke.points;
        var last = pts[pts.length - 1];
        var dx = x - last.x, dy = y - last.y;
        if (dx * dx + dy * dy < 1.0) return;   /* skip sub-pixel jitter */
        /* Draw ONLY the new segment. round caps/joins hide the seams
           between consecutive segments, so the stroke looks continuous
           and smooth without needing a full-page redraw. */
        ctx.strokeStyle = currentStroke.color;
        ctx.lineWidth   = currentStroke.width;
        ctx.lineCap     = 'round';
        ctx.lineJoin    = 'round';
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(x, y);
        ctx.stroke();
        pts.push({ x: x, y: y });
        return;          /* NO renderPage() — that was the slow path */
      }
      if (currentTool === 'eraser') {
        eraseAt(x, y);   /* eraseAt itself only re-renders on actual hit */
        return;
      }
    }

    function endStroke() {
      if (!isDrawing) {
        currentStroke = null;
        return;
      }
      isDrawing = false;
      /* Use currentStroke (not currentTool) so a tool-switch mid-stroke
         still commits the stroke. */
      if (currentStroke && currentStroke.points.length > 0) {
        var page = pages[currentPage];
        page.strokes.push(currentStroke);
        page.undoStack.push({ type: 'draw', stroke: currentStroke });
        if (page.undoStack.length > MAX_UNDO) page.undoStack.shift();
        saveToStorage();
      }
      currentStroke = null;
      /* NO renderPage() — the stroke is already drawn on the canvas.
         A full re-render will happen later if the user undoes / erases /
         switches pages. At that point renderStroke redraws it with the
         smooth quadratic-curve path, which is visually similar enough
         that the user won't perceive a change. */
    }

    /* -------- Eraser (object-level) --------------------------- */
    function eraseAt(x, y) {
      var page = pages[currentPage];
      if (!page) return;
      var removed = [];
      var kept    = [];
      for (var i = 0; i < page.strokes.length; i++) {
        var s = page.strokes[i];
        if (strokeHit(s, x, y, ERASE_RADIUS)) {
          removed.push(s);
        } else {
          kept.push(s);
        }
      }
      if (removed.length > 0) {
        page.strokes = kept;
        page.undoStack.push({ type: 'erase', strokes: removed });
        if (page.undoStack.length > MAX_UNDO) page.undoStack.shift();
        saveToStorage();
        renderPage();
      }
    }

    /* -------- Undo -------------------------------------------- */
    function undo() {
      var page = pages[currentPage];
      if (!page || page.undoStack.length === 0) return;
      var action = page.undoStack.pop();
      if (action.type === 'draw') {
        var idx = page.strokes.indexOf(action.stroke);
        if (idx >= 0) page.strokes.splice(idx, 1);
      } else if (action.type === 'erase') {
        for (var i = 0; i < action.strokes.length; i++) {
          page.strokes.push(action.strokes[i]);
        }
      } else if (action.type === 'clear') {
        page.strokes = action.strokes;
      }
      saveToStorage();
      renderPage();
    }

    /* -------- Clear page -------------------------------------- */
    function clearPage() {
      var page = pages[currentPage];
      if (!page || page.strokes.length === 0) return;
      if (!confirm('Clear all strokes on this page?')) return;
      var snapshot = page.strokes.slice();
      page.undoStack.push({ type: 'clear', strokes: snapshot });
      if (page.undoStack.length > MAX_UNDO) page.undoStack.shift();
      page.strokes = [];
      saveToStorage();
      renderPage();
    }

    /* -------- Pages ------------------------------------------- */
    function goToPage(idx) {
      if (idx < 0 || idx >= pages.length) return;
      if (idx === currentPage) return;
      endStroke();              /* flush any in-progress stroke on current page */
      currentPage = idx;
      saveToStorage();
      renderPage();
    }
    function nextPage() { goToPage(currentPage + 1); }
    function prevPage() { goToPage(currentPage - 1); }

    function updatePageIndicator() {
      if (pageIndEl) {
        pageIndEl.textContent = (currentPage + 1) + ' / ' + pages.length;
      }
    }

    /* -------- Export PNG -------------------------------------- */
    function exportPNG() {
      endStroke();
      renderPage();             /* ensure canvas is in clean state */
      var dataURL;
      try {
        dataURL = canvas.toDataURL('image/png');
      } catch (e) {
        alert('Export failed: ' + e.message);
        return;
      }
      exportImg.src = dataURL;
      exportOverlay.style.display = '-webkit-box';
      exportOverlay.style.display = 'flex';
    }
    function closeExport() {
      exportOverlay.style.display = 'none';
      exportImg.src = '';
    }

    /* -------- Position helper --------------------------------- */
    function getPos(e) {
      var rect = canvas.getBoundingClientRect();
      var cx, cy;
      if (e.touches && e.touches.length > 0) {
        cx = e.touches[0].clientX;
        cy = e.touches[0].clientY;
      } else if (e.changedTouches && e.changedTouches.length > 0) {
        cx = e.changedTouches[0].clientX;
        cy = e.changedTouches[0].clientY;
      } else {
        cx = e.clientX;
        cy = e.clientY;
      }
      return { x: cx - rect.left, y: cy - rect.top };
    }

    /* -------- Canvas event wiring (touch + mouse) -------------- */
    function initCanvasEvents() {
      function onTouchStart(e) {
        e.preventDefault();
        var p = getPos(e);
        isDrawing = true;
        if (currentTool === 'eraser') {
          eraseAt(p.x, p.y);
        } else {
          startStroke(p.x, p.y);
          /* NO renderPage() — startStroke already drew the initial dot */
        }
      }
      function onTouchMove(e) {
        e.preventDefault();
        var p = getPos(e);
        continueStroke(p.x, p.y);
      }
      function onTouchEnd(e) {
        e.preventDefault();
        endStroke();
      }
      canvas.addEventListener('touchstart',  onTouchStart,  false);
      canvas.addEventListener('touchmove',   onTouchMove,   false);
      canvas.addEventListener('touchend',    onTouchEnd,    false);
      canvas.addEventListener('touchcancel', onTouchEnd,   false);

      /* Mouse events (desktop testing — same engine) */
      function onMouseDown(e) {
        var p = getPos(e);
        isDrawing = true;
        if (currentTool === 'eraser') {
          eraseAt(p.x, p.y);
        } else {
          startStroke(p.x, p.y);
          /* NO renderPage() — startStroke already drew the initial dot */
        }
      }
      function onMouseMove(e) {
        if (!isDrawing) return;
        var p = getPos(e);
        continueStroke(p.x, p.y);
      }
      function onMouseUp() { endStroke(); }
      function onMouseLeave() { if (isDrawing) endStroke(); }
      canvas.addEventListener('mousedown',  onMouseDown,  false);
      canvas.addEventListener('mousemove',  onMouseMove,  false);
      canvas.addEventListener('mouseup',    onMouseUp,    false);
      canvas.addEventListener('mouseleave', onMouseLeave, false);

      /* Block pinch on the canvas itself */
      canvas.addEventListener('gesturestart',   function (e) { e.preventDefault(); }, false);
      canvas.addEventListener('gesturechange',  function (e) { e.preventDefault(); }, false);
      canvas.addEventListener('gestureend',     function (e) { e.preventDefault(); }, false);
    }

    /* -------- Global gestures / resize ------------------------ */
    function initGlobalEvents() {
      document.addEventListener('gesturestart',  function (e) { e.preventDefault(); }, false);
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, false);
      document.addEventListener('dblclick',      function (e) { e.preventDefault(); }, false);

      var resizeTimer = null;
      function onResize() {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          if (isDrawing) endStroke();
          resizeCanvas();
        }, 150);
      }
      window.addEventListener('resize',            onResize, false);
      window.addEventListener('orientationchange', onResize, false);
    }

    /* ============================================================
       SECTION B — TOOLBAR / UI
       ============================================================ */

    function setTool(tool) {
      currentTool = tool;
      var penBtn = document.getElementById('penTool');
      var eraBtn = document.getElementById('eraserTool');
      if (tool === 'pen') {
        penBtn.className  = 'btn tool-btn active';
        eraBtn.className  = 'btn tool-btn';
      } else {
        penBtn.className  = 'btn tool-btn';
        eraBtn.className  = 'btn tool-btn active';
      }
    }

    function setColor(color) {
      currentColor = color;
      var btns = document.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) {
        var b = btns[i];
        if (b.className.indexOf('color-btn') >= 0) {
          if (b.getAttribute('data-color') === color) {
            b.className = 'btn color-btn active';
          } else {
            b.className = 'btn color-btn';
          }
        }
      }
      setTool('pen');
    }

    function setWidth(w) {
      currentWidth = w;
      var btns = document.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) {
        var b = btns[i];
        if (b.className.indexOf('width-btn') >= 0) {
          if (parseInt(b.getAttribute('data-width'), 10) === w) {
            b.className = 'btn width-btn active';
          } else {
            b.className = 'btn width-btn';
          }
        }
      }
      setTool('pen');
    }

    /* Button wiring: fire on touchstart (instant), with click as
       fallback for desktop mouse. Suppresses the synthetic click
       that iOS fires ~300ms after touchstart. */
    function bindButton(el, handler) {
      var lastTouch = 0;
      el.addEventListener('touchstart', function (e) {
        e.preventDefault();
        e.stopPropagation();
        lastTouch = Date.now();
        handler();
      }, false);
      el.addEventListener('click', function (e) {
        e.preventDefault();
        if (Date.now() - lastTouch < 600) return;
        handler();
      }, false);
    }

    function initUI() {
      canvas        = document.getElementById('canvas');
      ctx           = canvas.getContext('2d');
      toolbarEl     = document.getElementById('toolbar');
      warningEl     = document.getElementById('warning');
      exportOverlay = document.getElementById('exportOverlay');
      exportImg     = document.getElementById('exportImg');
      pageIndEl     = document.getElementById('pageInd');

      bindButton(document.getElementById('penTool'),    function () { setTool('pen'); });
      bindButton(document.getElementById('eraserTool'),  function () { setTool('eraser'); });

      var colorBtns = document.getElementsByClassName('color-btn');
      for (var i = 0; i < colorBtns.length; i++) {
        (function (btn) {
          bindButton(btn, function () {
            setColor(btn.getAttribute('data-color'));
          });
        })(colorBtns[i]);
      }

      var widthBtns = document.getElementsByClassName('width-btn');
      for (var j = 0; j < widthBtns.length; j++) {
        (function (btn) {
          bindButton(btn, function () {
            setWidth(parseInt(btn.getAttribute('data-width'), 10));
          });
        })(widthBtns[j]);
      }

      bindButton(document.getElementById('undoBtn'),      undo);
      bindButton(document.getElementById('clearBtn'),     clearPage);
      bindButton(document.getElementById('prevBtn'),      prevPage);
      bindButton(document.getElementById('nextBtn'),      nextPage);
      bindButton(document.getElementById('exportBtn'),   exportPNG);
      bindButton(document.getElementById('exportClose'),  closeExport);

      /* Sync initial visual state with initial state vars */
      setTool('pen');
      setColor('#000000');
      setWidth(4);
    }

    /* -------- Boot ------------------------------------------- */
    function init() {
      initUI();
      initCanvasEvents();
      initGlobalEvents();
      loadFromStorage();
      resizeCanvas();
      renderPage();
    }

    if (document.readyState === 'complete' ||
        document.readyState === 'interactive') {
      init();
    } else {
      document.addEventListener('DOMContentLoaded', init, false);
    }
  })();
  </script>
</body>
</html>
